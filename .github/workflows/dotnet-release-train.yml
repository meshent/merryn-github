# Reusable: the release train. One scheduled or dispatched run that builds, tests, packs and publishes every
# repository of a tenant in dependency order, then promotes each repository's `release` branch to `main` and
# tags it. Mechanics and rationale: docs/release-trains.md (section 3).
#
# One job, one runner, one restore cache, no per-job minute rounding. The phases, in order:
#   1. assemble  clone every manifest repository at the release branch; read every .csproj; compute the
#                dependency order across repositories and across projects (a cycle fails the run, named).
#   2. select    a repository is in the train when its release branch differs from its last train/* tag (or
#                it has none); `select: all` takes every repository.
#   3. stamp     one version for the whole train, derived once from the clock the way the repositories'
#                Directory.Build.props already does (days and half-seconds since 2020-01-01 UTC), passed to
#                every pack as VersionBuild/VersionRevision. The train id is that version.
#   4. build     for each selected repository, bottom-up: restore with a LOCAL feed folder added as a mapped
#                source (so a downstream resolves the upstream packed a minute earlier), run the test gate
#                from source (-p:UseProjectReferences=true where the repository has the switch), clean, then
#                pack every packable project in dependency order into the local feed WITHOUT the switch.
#   5. publish   only when every selected repository passed: push every package in order (skip-duplicate).
#                Dry-run stops here and uploads the local feed as an artifact instead.
#   6. promote   fast-forward release to main in each selected repository, tag train/<id>, push.
#   7. record    the run summary: repositories, packages and versions, the tag.
# Hosts and pins (manifest `hosts`) are read and listed but not acted on yet; that is the next phase.
#
# IMPORTANT until the per-repository publish workflows are retired: a real (non-dry-run) train pushes `main`
# in every selected repository, and a repository whose publish workflow still triggers on push to main will
# republish with its own stamp. Retire those triggers (or make them dispatch-only) before the first real train.
name: Release train (reusable)

on:
  workflow_call:
    inputs:
      manifest:
        description: Path, in the calling repository, of the train manifest (JSON; see README)
        type: string
        required: true
      dry-run:
        description: Assemble, test and pack only; publish nothing, push nothing; upload the feed as an artifact
        type: boolean
        default: true
      branch:
        description: The branch the train takes from every repository
        type: string
        default: release
      select:
        description: "changed: repositories whose branch differs from their last train/* tag; all: every repository"
        type: string
        default: changed
      override:
        description: Run even when the organization's Actions budget state is hard
        type: boolean
        default: false
      dotnet-version:
        type: string
        default: "10.0.x"
      feed:
        description: The NuGet feed packages are published to; empty derives https://nuget.pkg.github.com/<owner>/index.json
        type: string
        default: ""
    secrets:
      repos-token:
        description: Reads every manifest repository and, on a real train, pushes main and the train tag in each (contents read/write on all of them)
        required: true
      packages-token:
        description: Reads the feed during restore and writes it on publish (read:packages, write:packages)
        required: true
    outputs:
      train:
        description: The train id (the version every package carries), or empty when nothing was selected
        value: ${{ jobs.train.outputs.train }}
      repositories:
        description: Space-separated repositories the train took
        value: ${{ jobs.train.outputs.repositories }}

permissions:
  contents: read

concurrency:
  group: release-train-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  train:
    if: ${{ inputs.override || vars.ACTIONS_BUDGET_STATE != 'hard' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      train: ${{ steps.stamp.outputs.train }}
      repositories: ${{ steps.select.outputs.repositories }}
    env:
      WORK: ${{ github.workspace }}/.train
      FEED_DIR: ${{ github.workspace }}/.train/feed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-train-${{ runner.os }}-${{ hashFiles(inputs.manifest) }}-${{ github.run_id }}
          restore-keys: |
            nuget-train-${{ runner.os }}-${{ hashFiles(inputs.manifest) }}-
            nuget-train-${{ runner.os }}-

      - name: Read the manifest
        id: manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          [ -f "$MANIFEST" ] || { echo "::error::no such manifest: $MANIFEST"; exit 2; }
          jq -e '.repos | length > 0' "$MANIFEST" >/dev/null || { echo "::error::$MANIFEST has no repos"; exit 2; }
          org=$(jq -r '.org // empty' "$MANIFEST"); [ -n "$org" ] || org="${GITHUB_REPOSITORY_OWNER}"
          echo "org=$org" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.repos | length' "$MANIFEST")" >> "$GITHUB_OUTPUT"
          mkdir -p "$WORK/repos" "$FEED_DIR"
          cp "$MANIFEST" "$WORK/manifest.json"

      - name: Clone every repository at the train branch
        env:
          GH_TOKEN: ${{ secrets.repos-token }}
          ORG: ${{ steps.manifest.outputs.org }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          gh auth setup-git
          for name in $(jq -r '.repos[] | if type == "string" then . else .repo end' "$WORK/manifest.json"); do
            echo "::group::clone $ORG/$name@$BRANCH"
            git clone --quiet --branch "$BRANCH" "https://github.com/$ORG/$name" "$WORK/repos/$name" \
              || { echo "::error::$ORG/$name has no branch '$BRANCH' (create it from main, or pass branch: main for a dry run)"; exit 2; }
            git -C "$WORK/repos/$name" fetch --quiet --tags origin
            echo "::endgroup::"
          done

      - name: Compute the dependency order
        id: graph
        run: |
          set -euo pipefail
          cat > "$WORK/graph.py" <<'PY'
          import json, os, re, sys, xml.etree.ElementTree as ET
          work, manifest_path, out_path = sys.argv[1:4]
          manifest = json.load(open(manifest_path))
          repos = []
          for entry in manifest["repos"]:
              e = {"repo": entry} if isinstance(entry, str) else dict(entry)
              e.setdefault("test", True); e.setdefault("pack", True); e.setdefault("solution", "")
              repos.append(e)
          SKIP = re.compile(r"(^|/)(bin|obj|\.git|\.worktrees|_wt|node_modules)(/|$)")
          projects = {}            # (repo, csproj path) -> {id, refs, test, packable}
          package_owner = {}       # package id -> (repo, csproj)
          for e in repos:
              root = os.path.join(work, "repos", e["repo"])
              for dirpath, dirnames, filenames in os.walk(root):
                  rel = os.path.relpath(dirpath, root)
                  if SKIP.search(rel.replace(os.sep, "/") + "/"): dirnames[:] = []; continue
                  for f in filenames:
                      if not f.endswith(".csproj"): continue
                      path = os.path.join(dirpath, f)
                      try: tree = ET.parse(path)
                      except ET.ParseError as ex: print(f"::warning::{path}: {ex}"); continue
                      r = tree.getroot()
                      text = lambda tag: next((x.text.strip() for x in r.iter(tag) if x.text), "")
                      stem = f[:-7]
                      # PackageId is usually absent (the stem) or the expression $(MSBuildProjectName); any other
                      # expression cannot be evaluated here and falls back to the stem.
                      pkg_id = text("PackageId").replace("$(MSBuildProjectName)", stem) or stem
                      if "$(" in pkg_id: pkg_id = stem
                      refs = [x.get("Include") for x in r.iter("PackageReference") if x.get("Include")]
                      projrefs = [x.get("Include") for x in r.iter("ProjectReference") if x.get("Include")]
                      is_test = (text("IsTestProject").lower() == "true" or "Microsoft.NET.Test.Sdk" in refs
                                 or "/Tests/" in ("/" + rel.replace(os.sep, "/") + "/"))
                      # A host (web app or executable) is not a package unless it says IsPackable=true itself.
                      is_host = ".Web" in (r.get("Sdk") or "") or text("OutputType").lower() == "exe"
                      packable_said = text("IsPackable").lower()
                      packable = e["pack"] and not is_test and packable_said != "false" and (not is_host or packable_said == "true")
                      projects[(e["repo"], os.path.relpath(path, root))] = {
                          "id": pkg_id, "refs": refs, "projrefs": projrefs, "test": is_test, "packable": packable}
                      if packable:
                          if pkg_id in package_owner and package_owner[pkg_id][0] != e["repo"]:
                              print(f"::error::package {pkg_id} is produced by two repositories: {package_owner[pkg_id][0]} and {e['repo']}"); sys.exit(2)
                          package_owner[pkg_id] = (e["repo"], os.path.relpath(path, root))
          # repo graph
          names = [e["repo"] for e in repos]
          edges = {n: set() for n in names}
          for (repo, path), p in projects.items():
              if not p["packable"] and p["test"]: continue
              for ref in p["refs"]:
                  owner = package_owner.get(ref)
                  if owner and owner[0] != repo: edges[repo].add(owner[0])
          def topo(nodes, deps):
              order, state = [], {n: 0 for n in nodes}
              def visit(n, stack):
                  if state[n] == 2: return
                  if state[n] == 1:
                      cycle = stack[stack.index(n):] + [n]
                      print("::error::dependency cycle: " + " -> ".join(cycle)); sys.exit(2)
                  state[n] = 1; stack.append(n)
                  for d in sorted(deps[n], key=lambda x: nodes.index(x) if x in nodes else 1e9): visit(d, stack)
                  stack.pop(); state[n] = 2; order.append(n)
              for n in nodes: visit(n, [])
              return order
          repo_order = topo(names, edges)
          # project order within each repo (sibling edges: PackageReference to a sibling id, or ProjectReference)
          result = []
          for name in repo_order:
              e = next(x for x in repos if x["repo"] == name)
              mine = {path: p for (r, path), p in projects.items() if r == name and p["packable"]}
              id_to_path = {p["id"]: path for path, p in mine.items()}
              deps = {}
              for path, p in mine.items():
                  d = set()
                  for ref in p["refs"]:
                      if ref in id_to_path and id_to_path[ref] != path: d.add(id_to_path[ref])
                  for pr in p["projrefs"]:
                      target = os.path.normpath(os.path.join(os.path.dirname(path), pr.replace("\\", "/")))
                      if target in mine and target != path: d.add(target)
                  deps[path] = d
              proj_order = topo(sorted(mine), deps)
              root = os.path.join(work, "repos", name)
              sol = e["solution"]
              if not sol:
                  cands = sorted(f for f in os.listdir(root) if f.endswith((".slnx", ".sln")))
                  sol = cands[0] if cands else ""
              targets = os.path.join(root, "Directory.Build.targets")
              has_switch = os.path.exists(targets) and "UseProjectReferences" in open(targets, encoding="utf-8", errors="ignore").read()
              result.append({"repo": name, "solution": sol, "test": bool(e["test"]) and bool(sol), "switch": has_switch,
                             "depends_on": sorted(edges[name]),
                             "projects": [{"path": p, "id": mine[p]["id"]} for p in proj_order]})
          all_ids = sorted(package_owner)
          json.dump({"order": result, "packages": all_ids}, open(out_path, "w"), indent=2)
          print("Repository order: " + " -> ".join(r["repo"] for r in result))
          for r in result:
              print(f"  {r['repo']}: {len(r['projects'])} packages; solution={r['solution'] or '<none>'}; source-graph switch={r['switch']}; depends on {r['depends_on'] or 'nothing in the manifest'}")
          PY
          python3 -I "$WORK/graph.py" "$WORK" "$WORK/manifest.json" "$WORK/graph.json"
          echo "packages=$(jq -r '.packages | join(" ")' "$WORK/graph.json")" >> "$GITHUB_OUTPUT"

      - name: Select the repositories in this train
        id: select
        env:
          SELECT: ${{ inputs.select }}
        run: |
          set -euo pipefail
          selected=""
          for name in $(jq -r '.order[].repo' "$WORK/graph.json"); do
            r="$WORK/repos/$name"
            head=$(git -C "$r" rev-parse HEAD)
            last=$(git -C "$r" tag -l 'train/*' --sort=-v:refname | head -1)
            if [ "$SELECT" = "all" ]; then why="select=all"
            elif [ -z "$last" ]; then why="no train tag yet"
            elif [ "$(git -C "$r" rev-parse "$last^{commit}")" = "$head" ]; then echo "  $name: unchanged since $last"; continue
            else why="changed since $last ($(git -C "$r" rev-list --count "$last..HEAD") commits)"; fi
            echo "  $name: IN ($why)"; selected="$selected $name"
          done
          selected=${selected# }
          echo "repositories=$selected" >> "$GITHUB_OUTPUT"
          [ -n "$selected" ] || echo "::notice::Nothing has changed since the last train; nothing to build."

      - name: Stamp the train
        id: stamp
        if: ${{ steps.select.outputs.repositories != '' }}
        run: |
          set -euo pipefail
          now=$(date -u +%s); epoch=$(date -u -d 2020-01-01T00:00:00Z +%s)
          secs=$(( now - epoch )); build=$(( secs / 86400 )); revision=$(( (secs % 86400) / 2 ))
          echo "build=$build" >> "$GITHUB_OUTPUT"; echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "train=0.0.$build.$revision" >> "$GITHUB_OUTPUT"
          echo "Train 0.0.$build.$revision"

      - name: Build, test and pack, bottom-up, into the local feed
        if: ${{ steps.select.outputs.repositories != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.packages-token }}
          SELECTED: ${{ steps.select.outputs.repositories }}
          VBUILD: ${{ steps.stamp.outputs.build }}
          VREVISION: ${{ steps.stamp.outputs.revision }}
          PACKAGES: ${{ steps.graph.outputs.packages }}
        run: |
          set -euo pipefail
          cat > "$WORK/feedconfig.py" <<'PY'
          # Add the local train feed to a repository's nuget.config as a mapped source for every manifest package,
          # so restore resolves a sibling packed a minute ago before it looks at the public feed. Not committed.
          import os, sys, xml.etree.ElementTree as ET
          root, feed, packages = sys.argv[1], sys.argv[2], sys.argv[3].split()
          path = os.path.join(root, "nuget.config")
          if not os.path.exists(path): path = os.path.join(root, "NuGet.Config")
          if os.path.exists(path):
              tree = ET.parse(path); cfg = tree.getroot()
          else:
              cfg = ET.Element("configuration"); tree = ET.ElementTree(cfg); path = os.path.join(root, "nuget.config")
              ps = ET.SubElement(cfg, "packageSources"); ET.SubElement(ps, "add", key="nuget.org", value="https://api.nuget.org/v3/index.json")
          sources = cfg.find("packageSources")
          if sources is None: sources = ET.SubElement(cfg, "packageSources")
          for a in list(sources.findall("add")):
              if a.get("key") == "train": sources.remove(a)
          ET.SubElement(sources, "add", key="train", value=feed)
          mapping = cfg.find("packageSourceMapping")
          if mapping is not None:
              for s in list(mapping.findall("packageSource")):
                  if s.get("key") == "train": mapping.remove(s)
              s = ET.SubElement(mapping, "packageSource", key="train")
              prefixes = sorted({p.split(".")[0] + ".*" for p in packages})
              for pat in prefixes + packages: ET.SubElement(s, "package", pattern=pat)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
          for name in $SELECTED; do
            r="$WORK/repos/$name"
            cfg=$(jq -c --arg n "$name" '.order[] | select(.repo == $n)' "$WORK/graph.json")
            sol=$(jq -r '.solution' <<<"$cfg"); test=$(jq -r '.test' <<<"$cfg"); switch=$(jq -r '.switch' <<<"$cfg")
            echo "::group::$name: feed config"
            python3 -I "$WORK/feedconfig.py" "$r" "$FEED_DIR" "$PACKAGES"
            echo "::endgroup::"
            if [ "$test" = "true" ]; then
              echo "::group::$name: test ($sol, source graph: $switch)"
              if [ "$switch" = "true" ]; then
                (cd "$r" && dotnet test "$sol" --configuration Release -p:UseProjectReferences=true --nologo)
              else
                (cd "$r" && dotnet test "$sol" --configuration Release --nologo)
              fi
              echo "::endgroup::"
              # Never pack from a tree built with the switch: a switched obj/ records never-published sibling versions.
              (cd "$r" && git clean -xdfq -e nuget.config -e NuGet.Config)
            fi
            for proj in $(jq -r '.projects[].path' <<<"$cfg"); do
              echo "::group::$name: pack $proj"
              (cd "$r" && dotnet pack "$proj" --configuration Release --nologo --output "$FEED_DIR" \
                 -p:VersionBuild="$VBUILD" -p:VersionRevision="$VREVISION" -p:ContinuousIntegrationBuild=true)
              echo "::endgroup::"
            done
          done
          echo "Local feed:"; ls -1 "$FEED_DIR"

      - name: Upload the local feed (dry run)
        if: ${{ inputs.dry-run && steps.select.outputs.repositories != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: train-${{ steps.stamp.outputs.train }}-feed
          path: ${{ env.FEED_DIR }}
          retention-days: 7

      - name: Publish every package, in order
        if: ${{ !inputs.dry-run && steps.select.outputs.repositories != '' }}
        env:
          PACKAGES_TOKEN: ${{ secrets.packages-token }}
          FEED: ${{ inputs.feed }}
          SELECTED: ${{ steps.select.outputs.repositories }}
          TRAIN: ${{ steps.stamp.outputs.train }}
        run: |
          set -euo pipefail
          [ -n "$FEED" ] || FEED="https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          for name in $SELECTED; do
            for id in $(jq -r --arg n "$name" '.order[] | select(.repo == $n) | .projects[].id' "$WORK/graph.json"); do
              f="$FEED_DIR/$id.$TRAIN.nupkg"
              [ -f "$f" ] || { echo "::error::expected $f after packing $name"; exit 2; }
              dotnet nuget push "$f" --source "$FEED" --api-key "$PACKAGES_TOKEN" --skip-duplicate
            done
          done

      - name: Promote release to main and tag the train
        if: ${{ !inputs.dry-run && steps.select.outputs.repositories != '' }}
        env:
          GH_TOKEN: ${{ secrets.repos-token }}
          SELECTED: ${{ steps.select.outputs.repositories }}
          TRAIN: ${{ steps.stamp.outputs.train }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          for name in $SELECTED; do
            r="$WORK/repos/$name"
            git -C "$r" fetch --quiet origin main
            if ! git -C "$r" merge-base --is-ancestor origin/main HEAD; then
              echo "::error::$name: main has commits that are not on $BRANCH; main is written only by the train. Merge main into $BRANCH and run again."; exit 2
            fi
            git -C "$r" -c user.name="release-train" -c user.email="release-train@users.noreply.github.com" tag -a "train/$TRAIN" -m "Release train $TRAIN"
            git -C "$r" push --quiet origin "HEAD:refs/heads/main" "refs/tags/train/$TRAIN"
            echo "$name: main -> $(git -C "$r" rev-parse --short HEAD), tagged train/$TRAIN"
          done

      - name: Record
        if: ${{ always() }}
        env:
          SELECTED: ${{ steps.select.outputs.repositories }}
          TRAIN: ${{ steps.stamp.outputs.train }}
          DRY: ${{ inputs.dry-run }}
        run: |
          {
            echo "## Release train ${TRAIN:-<nothing selected>}$([ "$DRY" = "true" ] && echo ' (dry run)')"
            echo
            if [ -f "$WORK/graph.json" ]; then
              echo "| repository | in train | packages | depends on |"; echo "|---|---|---|---|"
              for name in $(jq -r '.order[].repo' "$WORK/graph.json"); do
                in=no; case " $SELECTED " in *" $name "*) in=yes;; esac
                echo "| $name | $in | $(jq -r --arg n "$name" '.order[] | select(.repo == $n) | .projects | map(.id) | join(", ")' "$WORK/graph.json") | $(jq -r --arg n "$name" '.order[] | select(.repo == $n) | .depends_on | join(", ")' "$WORK/graph.json") |"
              done
              echo
              if [ -d "$FEED_DIR" ] && [ -n "$(ls -A "$FEED_DIR" 2>/dev/null)" ]; then
                echo "Packed:"; echo; for f in "$FEED_DIR"/*.nupkg; do echo "- $(basename "$f")"; done; echo
              fi
              hosts=$(jq -r '(.hosts // []) | map(.repo) | join(", ")' "$WORK/manifest.json")
              [ -n "$hosts" ] && echo "Hosts listed, not acted on in this phase: $hosts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
