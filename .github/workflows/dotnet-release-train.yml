# Reusable: the release train. One run, one job, every repository in a manifest, in dependency order, one version stamp
# for the packages that changed.
#
# Call it from a thin wrapper in the tenant's aggregator repository (see README.md), dispatched only: each release is
# proposed and runs on the owner's yes, never on a schedule. The job:
#
#   plan     clones every manifest repository at `ref` (default `release`), reads every .csproj, and sorts the
#            repositories (then the projects inside each) by their package edges: a PackageReference to a package
#            another manifest repository produces is an edge. A cycle fails the run and names it. A PACKAGE is in the
#            train only when its project changed since its last publication (the repository's latest train/* tag, else
#            the commit its newest version on the org feed was packed from), a package it depends on is in the train, or
#            it was never published; every other package is neither packed nor pushed. A repository is in the train when
#            one of its packages is, or when `ref` has commits main lacks (main moves even when nothing is published).
#            The version stamp is read ONCE from the clock with Directory.Build.props' formula (UTC, one reading) and is
#            the train id; nothing sets Version*, PackageVersion or GITHUB_RUN_NUMBER by hand.
#   build    bottom-up, per selected repository: adds the runner-local feed to its nuget.config (never committed), runs
#            its tests from source (with -p:UseProjectReferences=true where Directory.Build.targets has that switch),
#            then packs every package of it that is in the train WITHOUT the switch, from a copy taken before anything
#            was built, into the local feed. A downstream repository restores the upstream packed minutes earlier. Every
#            package must carry the train stamp and every in-train dependency in its nuspec must name that same version.
#            Before packing, an exact pin on an in-train package moves to the train version and one on any other manifest
#            package moves forward (never back) to its newest release already on the feed, so nothing packs against a
#            pin that a dependency published ahead of it has outpaced.
#            Then each selected HOST (the manifest's `hosts`), after every package repository: the same pin resolution
#            (the train version for an in-train package, else its newest published release or main's carried pin), its
#            build target built and its test target tested against the local feed. Hosts are never packed or published; a
#            host failure fails the train here, before publish. A host is in the train when its ref has commits main lacks
#            or a package it references is in the train.
#   publish  only when every selected repository built and passed: pushes each package, in order, --skip-duplicate.
#   promote  per repository: pushes the train's pin commit to `ref` when that still fast-forwards (when a lane merged
#            into `ref` while the train ran, `ref` keeps the lane's work and the next plan reconciles), fast-forwards main
#            to exactly what was built (a plain push, never forced) and tags train/<version>. A repository it cannot
#            promote is recorded as stranded and the others are still promoted; the step then fails naming them.
#            Selected hosts are promoted the same way, last; their main moving is their deploy (the host's own workflow on
#            the main push), nothing is dispatched from here.
#   record   writes the run summary and, when merryn-url is set, POSTs the release record.
#
# promote-only (recovery, with `version`) skips plan, build and publish: for a train whose packages are already on the
# feed (every package of a named repo must be there at that version) it fast-forwards main and tags train/<version> at the
# repo=sha entries it is given, re-deriving the pins that train packed,
# and refuses any sha that is not on `ref` (or main). dry-run with promote-only checks and reports, pushing nothing.
#
# dry-run (the default until the first real train) stops after build and uploads the local feed as an artifact.
# The job skips while the org's ACTIONS_BUDGET_STATE is `hard`, unless `override` is set (the hotfix reserve).
name: dotnet release train (reusable)

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the train manifest in the calling repository
        type: string
        default: release-train.json
      ref:
        description: The branch the train assembles from in every manifest repository
        type: string
        default: release
      ref-overrides:
        description: "Dry runs only: repo=ref entries (one per line or comma-separated); conflicting refs for one repo fail before checkout, identical repeats are accepted; a live train refuses overrides"
        type: string
        default: ""
      promote-only:
        description: "Recovery: repo=sha entries (one per line or comma-separated) to promote for the already-published train `version`; skips plan, build and publish"
        type: string
        default: ""
      version:
        description: With promote-only, the train version (train/<version>) whose packages are already on the feed
        type: string
        default: ""
      dry-run:
        description: Build, test and pack into a local feed, upload it as an artifact, publish and promote nothing
        type: boolean
        default: true
      override:
        description: Run even when vars.ACTIONS_BUDGET_STATE is 'hard' (the hotfix reserve)
        type: boolean
        default: false
      dotnet-version:
        type: string
        default: "10.0.x"
    secrets:
      repos-token:
        description: Reads every manifest repository; on a live train also pushes main and train/* tags
        required: true
      packages-token:
        description: read:packages for restore; on a live train also write:packages for the push
        required: true
      dispatch-token:
        description: "Accepted and unused: a host deploys from its own main push, which promotion makes"
        required: false
      merryn-token:
        description: Bearer token for the release record
        required: false
      merryn-url:
        description: Endpoint the release record is POSTed to; unset skips the record
        required: false
    outputs:
      version:
        description: The train version (also the train id and the train/<version> tag)
        value: ${{ jobs.train.outputs.version }}

permissions:
  contents: read

jobs:
  train:
    if: ${{ vars.ACTIONS_BUDGET_STATE != 'hard' || inputs.override }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # One train at a time per organization, and a train is never cancelled half-way: a killed publish strands a
    # half-train on the feed.
    concurrency:
      group: release-train-${{ github.repository_owner }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.plan.outputs.version || steps.promote-only.outputs.version }}
    env:
      TRAIN_WORK: ${{ github.workspace }}/_train
      TRAIN_REF: ${{ inputs.ref }}
      TRAIN_REF_OVERRIDES: ${{ inputs.ref-overrides }}
      TRAIN_DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: caller

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Write the train script
        run: |
          cat > "$RUNNER_TEMP/train.py" <<'TRAIN_PY'
          """dotnet release train: one run, every manifest repository, dependency order, one version stamp.

          Subcommands, run in this order by dotnet-release-train.yml (each reads what the previous one wrote under
          TRAIN_WORK):

            plan      clone every manifest repo at TRAIN_REF, read every .csproj, sort repos and projects by their
                      package edges (a cycle fails, naming it), select the packages that changed since their last
                      publication (select_packages) and the repos that carry one or are ahead of main, the hosts that
                      consume an in-train package or are ahead of main (select_host), read the one
                      version stamp from the clock, refuse a repo whose main is not an ancestor of TRAIN_REF
                      (a dry run warns instead: it promotes nothing). TRAIN_REF_OVERRIDES, dry runs only, takes the
                      repos it names at another branch, so a lane branch can ride a rehearsal before it merges
            build     per selected repo, bottom-up: bump every exact pin on an in-train package to the train version
                      and every stale exact pin on another manifest package forward to its newest published release
                      (committed on a live train), point its nuget.config at the local feed, pack its in-train projects
                      (without the source-graph switch, from an untouched copy) into the local feed, check every package
                      carries the train version and every in-train dependency in its nuspec names that same version, then
                      run its test gate from source; then each selected host (hosts last): the same pins, its build
                      and test targets against the local feed, nothing packed
            publish   push every package to the org feed in the same order (only reached when build passed everywhere)
            promote   per selected repo, then per selected host: the pin commit onto TRAIN_REF when that still
                      fast-forwards (else a warning; the next plan reconciles), main fast-forwarded to what was built, tag
                      train/<version>; a repo that cannot be promoted is recorded as stranded, the rest still are, and the
                      command fails naming them
            record    write the run summary and, when MERRYN_URL is set, POST the release record to it

            promote-only  (instead of plan..promote) finish a stranded promotion: TRAIN_VERSION names an already-published
                      train, TRAIN_PROMOTE lists repo=sha; every sha must be on TRAIN_REF (or main) with main its ancestor
                      (or ahead by train commits only), checked before anything is pushed

          Environment: TRAIN_WORK, TRAIN_MANIFEST, TRAIN_REF, TRAIN_REF_OVERRIDES, TRAIN_DRY_RUN, TRAIN_VERSION, TRAIN_PROMOTE, TRAIN_FEED,
          REPOS_TOKEN, PACKAGES_TOKEN, MERRYN_URL, MERRYN_TOKEN; GITHUB_STEP_SUMMARY, GITHUB_OUTPUT and GITHUB_SERVER_URL as
          Actions sets them.
          """
          import io
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          import zipfile
          from base64 import b64encode
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          WORK = Path(os.environ.get("TRAIN_WORK", "train")).resolve()
          SRC, PACK, FEED = WORK / "src", WORK / "pack", WORK / "feed"


          def checkout_dir(base, name):
              """Where a repository's checkout lives under SRC or PACK: <base>/<name>/<name>. The extra parent keeps each
              checkout alone in its folder, so a project that switches to a sibling checkout when one sits next to it (a
              ProjectReference conditioned on Exists('../../<repo>/...')) never sees the train's other repositories and builds
              and packs exactly as it does on its own."""
              return base / name / name
          PLAN = WORK / "plan.json"
          LOCAL_SOURCE = "train-local"
          SWITCH = "UseProjectReferences"
          ITEM_KEY = re.compile(r"\b(?:[a-z][a-z-]*:[A-Z]{1,5}\d+|FEAT-\d{3,5})\b")


          class TrainError(Exception):
              pass


          def log(message):
              print(message, flush=True)


          def basic_auth(token):
              return b64encode(f"x-access-token:{token}".encode()).decode()


          def redact(text):
              """Every secret this script handles, and the git header form of the repos token, replaced by ***. Applied to
              everything run() prints or raises, so a token never reaches a log even where the runner's masker is absent
              (a local run) or misses a derived form."""
              for name in ("REPOS_TOKEN", "PACKAGES_TOKEN", "MERRYN_TOKEN"):
                  secret = os.environ.get(name, "")
                  if secret:
                      text = text.replace(basic_auth(secret), "***").replace(secret, "***")
              return text


          def run(args, cwd=None, capture=False, env=None):
              shown = redact(" ".join(str(a) for a in args))
              log(f"$ {shown}")
              result = subprocess.run([str(a) for a in args], cwd=cwd, text=True, env=env,
                                      stdout=subprocess.PIPE if capture else None,
                                      stderr=subprocess.STDOUT if capture else None)
              if result.returncode != 0:
                  if capture:
                      log(redact(result.stdout))
                  raise TrainError(f"command failed ({result.returncode}): {shown}")
              return result.stdout if capture else ""


          def git(args, cwd=None, capture=False):
              # The token travels as a per-command header, never in a remote URL, so nothing on disk holds it; run() redacts
              # it from what it prints.
              token = os.environ.get("REPOS_TOKEN", "")
              auth = ["-c", f"http.extraHeader=AUTHORIZATION: basic {basic_auth(token)}"] if token else []
              return run(["git", *auth, *args], cwd=cwd, capture=capture)


          def dotnet_env():
              env = dict(os.environ, DOTNET_NOLOGO="1", DOTNET_CLI_TELEMETRY_OPTOUT="1")
              # Repo nuget.configs read the GitHub Packages password from %GITHUB_TOKEN%.
              if os.environ.get("PACKAGES_TOKEN"):
                  env["GITHUB_TOKEN"] = os.environ["PACKAGES_TOKEN"]
              return env


          # --- Manifest ----------------------------------------------------------------------------------------------------

          def load_manifest(path):
              data = json.loads(Path(path).read_text())
              org = data.get("org") or ""
              if not org:
                  raise TrainError(f"{path}: 'org' is required")
              repos = []
              for entry in data.get("repos", []):
                  repo = {"repo": entry} if isinstance(entry, str) else dict(entry)
                  if not repo.get("repo"):
                      raise TrainError(f"{path}: every repos entry needs a name: {entry!r}")
                  test_env = {**data.get("test-env", {}), **repo.get("test-env", {})}
                  if not all(isinstance(k, str) and isinstance(v, str) for k, v in test_env.items()):
                      raise TrainError(f"{repo['repo']}: test-env must map variable names to string values")
                  repos.append({"repo": repo["repo"], "solution": repo.get("solution", ""),
                                "test": repo.get("test", True), "test-args": repo.get("test-args", ""), "test-env": test_env})
              names = [r["repo"] for r in repos]
              if len(set(n.lower() for n in names)) != len(names):
                  raise TrainError(f"{path}: a repo is listed twice")
              if not repos:
                  raise TrainError(f"{path}: no repos")
              hosts = []
              for entry in data.get("hosts", []):
                  host = {"repo": entry} if isinstance(entry, str) else dict(entry)
                  if not host.get("repo"):
                      raise TrainError(f"{path}: every hosts entry needs a name: {entry!r}")
                  test_env = {**data.get("test-env", {}), **host.get("test-env", {})}
                  if not all(isinstance(k, str) and isinstance(v, str) for k, v in test_env.items()):
                      raise TrainError(f"{host['repo']}: test-env must map variable names to string values")
                  # A host is built and tested, never packed: `build` names what to build (its deployable hosts), `solution`
                  # what to test, as the host's own CI does. `deploy` and `pins` are kept for the record; promotion to main
                  # is what deploys a host whose main push triggers its deploy.
                  hosts.append({"repo": host["repo"], "host": True, "solution": host.get("solution", ""),
                                "build": host.get("build", ""), "test": host.get("test", True),
                                "test-args": host.get("test-args", ""), "test-env": test_env,
                                "deploy": host.get("deploy", ""), "pins": host.get("pins", "")})
              every = names + [h["repo"] for h in hosts]
              if len(set(n.lower() for n in every)) != len(every):
                  raise TrainError(f"{path}: a host is listed twice, or as both a repo and a host")
              return {"org": org, "repos": repos, "hosts": hosts}


          # --- Reading a repository ----------------------------------------------------------------------------------------

          def clone(org, repo, ref, dest):
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              # Blobless: the whole commit graph (ancestry, tags, messages) at the cost of one checkout.
              try:
                  git(["clone", "--quiet", "--filter=blob:none", "--branch", ref, f"{server}/{org}/{repo}.git", dest])
              except TrainError:
                  raise TrainError(f"{repo}: could not clone branch '{ref}'. A train repo needs that branch "
                                   f"(Phase 1b creates `release` from main in every manifest repo).")
              return git(["rev-parse", "HEAD"], cwd=dest, capture=True).strip()


          def version_key(text):
              return tuple(int(p) for p in text.split("."))


          def latest_train_tag(dest, before=None):
              """The highest train/* tag (by version) and its commit. With before, the highest one older than that train
              version: the tag a plan for that train saw, since a later train's stamp is always larger."""
              tags = []
              for line in git(["tag", "--list", "train/*"], cwd=dest, capture=True).split():
                  version = line[len("train/"):]
                  if re.fullmatch(r"\d+(\.\d+){1,3}", version) and (before is None or version_key(version) < version_key(before)):
                      tags.append((version_key(version), line))
              if not tags:
                  return None
              name = max(tags)[1]
              sha = git(["rev-list", "-n", "1", name], cwd=dest, capture=True).strip()
              return {"tag": name, "sha": sha}


          def is_ancestor(dest, ancestor, descendant):
              return subprocess.run(["git", "merge-base", "--is-ancestor", ancestor, descendant], cwd=dest).returncode == 0


          def find_projects(dest):
              return sorted(p for p in Path(dest).rglob("*.csproj")
                            if not ({"bin", "obj", ".git"} & set(p.relative_to(dest).parts)))


          def msbuild_properties(csproj, names):
              out = run(["dotnet", "msbuild", csproj, "-nologo", *[f"-getProperty:{n}" for n in names]],
                        capture=True, env=dotnet_env())
              text = out[out.find("{"):] if len(names) > 1 else out
              if len(names) == 1:
                  return {names[0]: text.strip()}
              return json.loads(text)["Properties"]


          def read_csproj(csproj):
              root = ET.parse(csproj).getroot()
              packages, projects = set(), set()
              for el in root.iter():
                  tag, include = el.tag.split("}")[-1], el.get("Include")
                  if tag == "PackageReference" and include:
                      packages.add(include)
                  elif tag == "ProjectReference" and include:
                      projects.add(str((Path(csproj).parent / include.replace("\\", "/")).resolve()))
              return packages, projects


          def outside_paths(dest, csproj):
              """Repo-relative paths outside the project's folder that its .csproj names (an Import, a Compile or None
              Include such as ../Shared/**/*.cs), each cut at its first wildcard or property: a change under one changes what
              the project builds. A ProjectReference is followed through its own project instead."""
              base, dest, found = Path(csproj).parent.resolve(), Path(dest).resolve(), set()
              for el in ET.parse(csproj).getroot().iter():
                  if el.tag.split("}")[-1] == "ProjectReference":
                      continue
                  for attr in ("Include", "Project", "Update"):
                      for part in (el.get(attr) or "").replace("\\", "/").split(";"):
                          part = re.sub(r"^\$\((MSBuildThisFileDirectory|MSBuildProjectDirectory)\)/?", "", part.strip())
                          if not part.startswith("../"):
                              continue
                          static = re.split(r"[*?$%@]", part, maxsplit=1)
                          prefix = static[0] if len(static) == 1 else static[0].rpartition("/")[0]
                          target = (base / prefix).resolve()
                          if target.is_relative_to(dest) and not target.is_relative_to(base):
                              found.add(target.relative_to(dest).as_posix())
              return sorted(found)


          # The MSBuild files in IMPORTED that can themselves <Import> more files. The build reads whatever they import too.
          IMPORTING = ("directory.build.props", "directory.build.targets", "directory.packages.props")


          def props_imports(dest, csproj):
              """Repo-relative paths the Directory.Build.props / .targets / Directory.Packages.props above a project import,
              followed through the files they import in turn. These files are watched by name (IMPORTED); what they import
              can sit anywhere in the repository (build/Common.props), so a change there changes the build too. A path
              that starts with a property other than $(MSBuildThisFileDirectory), such as GetPathOfFileAbove chaining to a
              parent Directory.Build.props, is skipped: those parents are watched by name already."""
              dest = Path(dest).resolve()
              stack, seen, found = [], set(), set()
              folder = Path(csproj).parent.resolve()
              while folder.is_relative_to(dest):
                  if folder.is_dir():
                      stack += [f for f in folder.iterdir() if f.is_file() and f.name.lower() in IMPORTING]
                  if folder == dest:
                      break
                  folder = folder.parent
              while stack:
                  file = stack.pop().resolve()
                  if file in seen:
                      continue
                  seen.add(file)
                  try:
                      root = ET.parse(file).getroot()
                  except (OSError, ET.ParseError):
                      continue
                  for el in root.iter():
                      if el.tag.split("}")[-1] != "Import":
                          continue
                      for part in (el.get("Project") or "").replace("\\", "/").split(";"):
                          part = re.sub(r"^\$\(MSBuildThisFileDirectory\)/?", "", part.strip())
                          if not part or part.startswith(("$", "/")) or re.match(r"^[A-Za-z]:", part):
                              continue
                          static = re.split(r"[*?$%@]", part, maxsplit=1)
                          prefix = static[0] if len(static) == 1 else static[0].rpartition("/")[0]
                          target = (file.parent / prefix).resolve()
                          if not target.is_relative_to(dest) or target == dest:
                              continue
                          found.add(target.relative_to(dest).as_posix())
                          if len(static) == 1 and target.is_file():
                              stack.append(target)
              return sorted(found)


          def describe_project(dest, csproj):
              packages, projects = read_csproj(csproj)
              props = msbuild_properties(csproj, ["PackageId", "IsPackable", "IsTestProject"])
              test = props.get("IsTestProject", "").lower() == "true" or "Microsoft.NET.Test.Sdk" in packages
              packable = props.get("IsPackable", "").lower() != "false" and not test
              return {"path": str(Path(csproj).relative_to(dest)), "id": props.get("PackageId") or Path(csproj).stem,
                      "packable": packable, "packages": sorted(packages),
                      "projects": sorted(str(Path(p).relative_to(dest)) for p in projects if Path(p).is_relative_to(dest)),
                      "outside": sorted(set(outside_paths(dest, csproj)) | set(props_imports(dest, csproj)))}


          def find_solution(dest, repo):
              if repo["solution"]:
                  return repo["solution"]
              found = sorted(p.name for p in Path(dest).iterdir() if p.suffix in (".slnx", ".sln"))
              if len(found) == 1:
                  return found[0]
              for preferred in (f"{repo['repo']}.slnx", f"{repo['repo']}.sln"):
                  if preferred in found:
                      return preferred
              raise TrainError(f"{repo['repo']}: {len(found)} solutions at the root ({', '.join(found) or 'none'}); "
                               f"name one with \"solution\" in the manifest")


          # --- Ordering ----------------------------------------------------------------------------------------------------

          def toposort(nodes, edges, what):
              """nodes in dependency order (a dependency before its dependents); edges[n] = what n depends on.

              Ties keep the input order, so the result is deterministic. A cycle raises TrainError naming it."""
              order, state = [], {}

              def visit(node, path):
                  if state.get(node) == "done":
                      return
                  if state.get(node) == "open":
                      cycle = path[path.index(node):] + [node]
                      raise TrainError(f"{what} dependency cycle: {' -> '.join(cycle)}")
                  state[node] = "open"
                  for dep in edges.get(node, ()):
                      visit(dep, path + [node])
                  state[node] = "done"
                  order.append(node)

              for node in nodes:
                  visit(node, [])
              return order


          # --- Stamp -------------------------------------------------------------------------------------------------------

          EPOCH = datetime(2020, 1, 1, tzinfo=timezone.utc)


          def stamp(now=None):
              """Directory.Build.props' formula from ONE UTC reading: Build = whole days since 2020-01-01, Revision = half
              seconds into that day. Passed to every pack as VersionBuild/VersionRevision, so the train has one version."""
              seconds = int(((now or datetime.now(timezone.utc)) - EPOCH).total_seconds())
              return seconds // 86400, (seconds % 86400) // 2


          def normalized_version(build, revision):
              # NuGet drops a trailing zero revision: 0.0.2471.0 is published (and named) 0.0.2471.
              return f"0.0.{build}.{revision}" if revision else f"0.0.{build}"


          def stamp_time(version):
              """The UTC moment a 0.0.<build>.<revision> stamp was read: stamp()'s inverse, to the second."""
              parts = version_key(version) + (0, 0)
              return EPOCH + timedelta(days=parts[2], seconds=parts[3] * 2)


          # --- nuget.config ------------------------------------------------------------------------------------------------

          def point_at_local_feed(dest, train_ids):
              """Add the local feed to the repo's nuget.config (in the runner's copy only) so a downstream restores the
              upstream packed minutes ago. Under packageSourceMapping, each train package id is mapped to the local feed
              AND to the GitHub source: an exact id pattern outranks `meshNet.*`, so without the second entry an exact pin
              on an older version could no longer resolve. Floats take the highest version, which is the train's."""
              config = Path(dest) / "nuget.config"
              if not config.exists():
                  config.write_text('<?xml version="1.0" encoding="utf-8"?>\n<configuration><packageSources>'
                                    '<add key="nuget.org" value="https://api.nuget.org/v3/index.json" />'
                                    '</packageSources></configuration>\n')
              tree = ET.parse(config)
              root = tree.getroot()
              sources = root.find("packageSources")
              if sources is None:
                  sources = ET.SubElement(root, "packageSources")
              for existing in [e for e in sources if e.get("key") == LOCAL_SOURCE]:
                  sources.remove(existing)
              ET.SubElement(sources, "add", key=LOCAL_SOURCE, value=str(FEED))
              mapping = root.find("packageSourceMapping")
              if mapping is not None:
                  github_keys = [e.get("key") for e in sources
                                 if e.tag == "add" and "nuget.pkg.github.com" in (e.get("value") or "")]
                  for key in [LOCAL_SOURCE, *github_keys]:
                      source = next((s for s in mapping if s.get("key") == key), None)
                      if source is None:
                          source = ET.SubElement(mapping, "packageSource", key=key)
                      have = {p.get("pattern") for p in source}
                      for package_id in sorted(train_ids):
                          if package_id not in have:
                              ET.SubElement(source, "package", pattern=package_id)
              tree.write(config, encoding="utf-8", xml_declaration=True)


          # --- Exact pins ---------------------------------------------------------------------------------------------------

          PIN = re.compile(r'(<Package(?:Reference|Version)\b[^>]*?\bInclude="(?P<id>[^"]+)"[^>]*?\bVersion=")(?P<version>[^"]*)(")')


          VERSION = re.compile(r"\d+(\.\d+){1,3}")


          def pin_train_versions(dest, train_ids, version, latest=None):
              """Bump every exact pin on a package this train produces to the train version, in every .csproj and
              Directory.Packages.props under dest. A float (`*`, `1.*`) is left alone: it resolves to the train version through
              the local feed by itself. Returns [(path, id, old, new)], the record of what the train rewrote. This is what makes
              exact pins (dependencies tracked, never discovered) and one-version trains compatible: the train is the one place
              that knows the version it is about to publish, so it maintains the pins, and on a live train commits them.

              latest maps a package NOT in this train to the newest version already published ahead of it: its newest
              release on the org feed below the train version (published_versions), or a pin a train already set for it on
              main when that is higher (the pins carried over when main is ahead of the ref by train commits only). An exact
              pin on one moves forward to that version, never back, and a range or prerelease is left as written. So a
              package is never packed against a stale pin that a dependency packed after it already outpaces (a float on
              a sibling resolves to its newest version, whose nuspec names the newer dependency: NU1605 otherwise). Every
              other pin stays exactly as the source has it: a pin only ever names a version that is published."""
              latest = latest or {}
              changed = []
              for path in sorted(list(Path(dest).rglob("*.csproj")) + list(Path(dest).rglob("Directory.Packages.props"))):
                  if {"bin", "obj", ".git"} & set(path.relative_to(dest).parts):
                      continue
                  text = path.read_text(encoding="utf-8")

                  def bump(m):
                      package_id, old = m.group("id"), m.group("version")
                      if package_id in train_ids:
                          new = version
                      elif package_id in latest and VERSION.fullmatch(old) and version_key(old) < version_key(latest[package_id]):
                          new = latest[package_id]
                      else:
                          return m.group(0)
                      if "*" in old or old == new:
                          return m.group(0)
                      changed.append((str(path.relative_to(dest)), package_id, old, new))
                      return f"{m.group(1)}{new}{m.group(4)}"

                  new = PIN.sub(bump, text)
                  if new != text:
                      path.write_text(new, encoding="utf-8")
              return changed


          # --- Checking what was packed ------------------------------------------------------------------------------------

          def nuspec_of(nupkg):
              with zipfile.ZipFile(nupkg) as z:
                  name = next(n for n in z.namelist() if n.endswith(".nuspec") and "/" not in n)
                  root = ET.fromstring(z.read(name))
              ns = {"n": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}
              find = (lambda e, p: e.findall(f".//n:{p}", ns)) if ns else (lambda e, p: e.findall(f".//{p}"))
              meta = find(root, "metadata")[0]
              get = (lambda tag: meta.find(f"n:{tag}", ns).text) if ns else (lambda tag: meta.find(tag).text)
              deps = [(d.get("id"), d.get("version")) for d in find(root, "dependency")]
              return get("id"), get("version"), deps


          def lower_bound(version_range):
              text = (version_range or "").strip()
              return text.strip("[(").split(",")[0].strip()


          def find_package(package_id, version):
              wanted = f"{package_id}.{version}.nupkg".lower()
              match = [p for p in FEED.glob("*.nupkg") if p.name.lower() == wanted]
              if not match:
                  raise TrainError(f"{package_id}: no {package_id}.{version}.nupkg in the local feed; the project did not "
                                   f"take the train stamp (its Directory.Build.props must accept VersionBuild/VersionRevision)")
              return match[0]


          def check_package(package_id, version, train_ids):
              nupkg = find_package(package_id, version)
              nid, nversion, deps = nuspec_of(nupkg)
              if nversion != version:
                  raise TrainError(f"{nupkg.name}: nuspec version {nversion}, expected the train version {version}")
              wrong = [(d, v) for d, v in deps if d in train_ids and lower_bound(v) != version]
              if wrong:
                  raise TrainError(f"{nupkg.name}: depends on {', '.join(f'{d} {v}' for d, v in wrong)}, not the train "
                                   f"version {version}; it restored a sibling from outside this train")
              return {"id": nid, "version": nversion, "file": nupkg.name,
                      "dependencies": [f"{d} {v}" for d, v in deps if d in train_ids]}


          # --- Reading the org feed (each package's last publication; promote-only) -----------------------------------------

          class _NoRedirect(urllib.request.HTTPRedirectHandler):
              # The feed request carries the packages token: never follow a redirect with it to another host.
              def redirect_request(self, *args, **kwargs):
                  return None


          _FEED = {}


          def _feed_source(org):
              """TRAIN_FEED names the feed: a NuGet v3 service index URL (default GitHub Packages for org) or a folder of
              .nupkg files."""
              return os.environ.get("TRAIN_FEED", "").strip() or f"https://nuget.pkg.github.com/{org}/index.json"


          def _feed_get(source, url):
              """GET url with the packages token. A redirect (GitHub Packages hands a download to blob storage) is followed
              once, over https only, WITHOUT the token, so the token never leaves the feed's host."""
              headers = {}
              if os.environ.get("PACKAGES_TOKEN") and source.startswith("https://"):
                  headers["Authorization"] = f"Basic {basic_auth(os.environ['PACKAGES_TOKEN'])}"
              opener = urllib.request.build_opener(_NoRedirect)
              try:
                  with opener.open(urllib.request.Request(url, headers=headers), timeout=60) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  location = (error.headers.get("Location") or "") if error.code in (301, 302, 303, 307, 308) else ""
                  if not location.startswith("https://"):
                      raise
                  with opener.open(urllib.request.Request(location), timeout=120) as response:
                      return response.read()


          def _feed_base(source):
              if (source, None) not in _FEED:
                  index = json.loads(_feed_get(source, source).decode("utf-8"))
                  _FEED[(source, None)] = next(r["@id"].rstrip("/") for r in index.get("resources", [])
                                               if str(r.get("@type", "")).startswith("PackageBaseAddress/3.0.0"))
              return _FEED[(source, None)]


          def feed_versions(org, package_id):
              """The versions of package_id on the org's feed, as NuGet normalizes them (lower case). A package the feed does
              not have is an empty set; a feed that cannot be read raises, so the plan and promote-only fail closed."""
              source = _feed_source(org)
              key = package_id.lower()
              if (source, key) in _FEED:
                  return _FEED[(source, key)]
              if not re.match(r"https?://", source):
                  prefix = key + "."
                  versions = {p.name.lower()[len(prefix):-len(".nupkg")] for p in Path(source).glob("*.nupkg")
                              if p.name.lower().startswith(prefix)}
              else:
                  try:
                      try:
                          url = f"{_feed_base(source)}/{urllib.parse.quote(key, safe='')}/index.json"
                          versions = {v.lower() for v in json.loads(_feed_get(source, url).decode("utf-8")).get("versions", [])}
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                          versions = set()
                  except (OSError, ValueError, StopIteration, KeyError) as error:
                      raise TrainError(f"could not read the package feed {source} for {package_id}: {redact(str(error))}")
              _FEED[(source, key)] = versions
              return versions


          def feed_commit(org, package_id, version):
              """The commit a published package was packed from: the <repository commit> its nuspec carries (Source Link
              writes it on every pack). None when the nuspec names none. A package that cannot be read raises."""
              source, key, ver = _feed_source(org), package_id.lower(), version.lower()
              try:
                  if not re.match(r"https?://", source):
                      found = [p for p in Path(source).glob("*.nupkg") if p.name.lower() == f"{key}.{ver}.nupkg"]
                      if not found:
                          raise TrainError(f"{package_id} {version} is not in the feed folder {source}")
                      data = found[0].read_bytes()
                  else:
                      quoted = urllib.parse.quote(key, safe="")
                      data = _feed_get(source, f"{_feed_base(source)}/{quoted}/{ver}/{quoted}.{ver}.nupkg")
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      name = next(n for n in z.namelist() if n.endswith(".nuspec") and "/" not in n)
                      root = ET.fromstring(z.read(name))
              except (OSError, ValueError, StopIteration, KeyError, zipfile.BadZipFile, ET.ParseError) as error:
                  raise TrainError(f"could not read {package_id} {version} from the package feed {source}: "
                                   f"{redact(str(error))}")
              repository = next((e for e in root.iter() if e.tag.split("}")[-1] == "repository"), None)
              commit = (repository.get("commit") or "").strip() if repository is not None else ""
              return commit if re.fullmatch(r"[0-9a-fA-F]{40}", commit) else None


          # --- Which packages changed since their last publication (coordinator:C47) ------------------------------------

          # Files a project's build reads from its own folder or any folder above it, up to the repository root. What the
          # MSBuild ones import in turn is followed by props_imports.
          IMPORTED = {"directory.build.props", "directory.build.targets", "directory.packages.props", "directory.build.rsp",
                      "nuget.config", "global.json", ".editorconfig"}
          # A plan reads every repository before it takes the stamp. A baseline inferred from a stamp's time steps back this
          # far, so it can only count more changes than were really built, never fewer, PROVIDED the ref's commits carry
          # dates from when they landed on it. A commit committed before the cutoff but fast-forwarded onto the ref after the
          # stamp keeps its old date, so it can land behind the baseline and be counted as already published. Only a
          # repository no train has tagged yet uses this fallback, and only until its first train tag.
          PLAN_MARGIN = timedelta(minutes=30)


          def has_commit(dest, sha):
              # A blobless clone must not ask the server for a commit it never received (GIT_NO_LAZY_FETCH, git 2.44+), and
              # an older git that still tries must fail rather than prompt.
              return subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], cwd=dest, capture_output=True,
                                    env=dict(os.environ, GIT_NO_LAZY_FETCH="1", GIT_TERMINAL_PROMPT="0")).returncode == 0


          def changed_files(dest, base, sha):
              """Repo-relative paths that differ between base and sha, counted from their merge base (base...sha). A base off
              the ref's history (a train's pin commit that only main took) counts from the ref commit it was made on, so
              the pins that commit set are not mistaken for a change."""
              out = git(["diff", "--name-only", "--no-renames", "-z", f"{base}...{sha}"], cwd=dest, capture=True)
              return sorted(path for path in out.split("\0") if path)


          def watched(project, by_path):
              """What a project's build reads from its repository: its folder (and, for the files in IMPORTED, every folder
              above it), the projects it references and theirs in turn, and the paths outside them their .csproj files name."""
              folders, outside, seen, stack = set(), set(), set(), [project["path"]]
              while stack:
                  path = stack.pop()
                  if path in seen:
                      continue
                  seen.add(path)
                  folders.add(Path(path).parent.as_posix())
                  if path in by_path:
                      stack += by_path[path]["projects"]
                      outside.update(by_path[path].get("outside", []))
              return folders, outside


          def touched(files, folders, outside):
              """The paths among files that change what a project reading these folders and outside paths builds."""
              def under(path, folder):
                  return folder in ("", ".") or path == folder or path.startswith(folder + "/")
              return [path for path in files
                      if any(under(path, f) for f in folders) or any(under(path, o) for o in outside)
                      or (Path(path).name.lower() in IMPORTED and any(under(f, Path(path).parent.as_posix()) for f in folders))]


          def baseline(org, repo, dest, package_id, versions):
              """Where a package's last publication was packed from, as (commit, how): its repository's latest train/* tag;
              with none, the commit the newest version on the feed names in its nuspec. When the repository never received
              that commit (an early train's pin commit, lost with its runner), the ref as it stood PLAN_MARGIN before that
              version's stamp. (None, why) when there is no baseline: the package then counts as changed."""
              if repo["tag"]:
                  return repo["tag"]["sha"], f"since {repo['tag']['tag']}"
              newest = max((v for v in versions if VERSION.fullmatch(v)), key=version_key, default=None)
              if newest is None:
                  return None, "never published (no release version on the feed)"
              commit = feed_commit(org, package_id, newest)
              if commit is None:
                  return None, f"its newest version on the feed, {newest}, names no commit"
              if has_commit(dest, commit):
                  return commit, f"since {newest} ({commit[:12]})"
              cutoff = stamp_time(newest) - PLAN_MARGIN
              found = git(["rev-list", "--first-parent", "-n", "1", f"--before={cutoff.isoformat()}", repo["sha"]],
                          cwd=dest, capture=True).strip()
              if not found:
                  return None, f"{newest} was packed from {commit[:12]}, which {repo['repo']} does not have"
              return found, (f"since {newest}, packed from {commit[:12]} which {repo['repo']} does not have, so {repo['ref']} "
                             f"as of {cutoff:%Y-%m-%d %H:%M}Z ({found[:12]})")


          def select_packages(org, repos, repo_order, manifest_ids):
              """The packages this train publishes, {id: reason}, and how every package was judged, {id: decision}. A package
              is in when it was never published, when its project (or a file it imports, or a project it references) changed
              since its baseline, when a package it depends on is in, or when it is packed with one that is (a project
              reference is packed as a dependency at the train version, so the referenced package must ship too)."""
              ship, decisions, links = {}, {}, {}
              for name in repo_order:
                  repo, dest = repos[name], checkout_dir(SRC, name)
                  by_path = {p["path"]: p for p in repo["projects"]}
                  diffs = {}
                  for path in repo["project_order"]:
                      project = by_path[path]
                      versions = feed_versions(org, project["id"])
                      base, how = baseline(org, repo, dest, project["id"], versions) if versions else (None, "never published")
                      hits = []
                      if base:
                          if base not in diffs:
                              diffs[base] = changed_files(dest, base, repo["sha"])
                          hits = touched(diffs[base], *watched(project, by_path))
                      decisions[project["id"]] = {"repo": name, "path": path, "baseline": base, "how": how, "files": hits[:20]}
                      if not base:
                          ship[project["id"]] = how
                      elif hits:
                          more = f" and {len(hits) - 3} more" if len(hits) > 3 else ""
                          ship[project["id"]] = f"changed {how}: {', '.join(hits[:3])}{more}"
                      # What its build takes from the manifest: package references (its own and its referenced projects'),
                      # and the packable projects it references.
                      packages, siblings, seen, stack = set(project["packages"]), set(), set(), list(project["projects"])
                      while stack:
                          ref = by_path.get(stack.pop())
                          if ref is None or ref["path"] in seen:
                              continue
                          seen.add(ref["path"])
                          packages.update(ref["packages"])
                          if ref["packable"]:
                              siblings.add(ref["id"])
                          stack += ref["projects"]
                      links[project["id"]] = (sorted(packages & manifest_ids - {project["id"]}), sorted(siblings))
              moved = True
              while moved:
                  moved = False
                  for package_id, (dependencies, siblings) in links.items():
                      if package_id in ship:
                          for sibling in siblings:
                              if sibling not in ship:
                                  ship[sibling] = f"packed with {package_id}, which references its project"
                                  moved = True
                      else:
                          in_train = [d for d in dependencies + siblings if d in ship]
                          if in_train:
                              ship[package_id] = f"depends on {', '.join(in_train)}, in this train"
                              moved = True
              return ship, decisions


          def select_host(host, ship, ahead):
              """(selected, reason) for a host: it is in the train when its ref has commits main lacks, or when a package it
              references (host["consumes"], the manifest packages any of its projects names) is in the train. A host is never
              packed, so "changed since its last publication" does not apply: what it has to prove is that it still builds and
              passes against what this train packs."""
              consumed = [p for p in host.get("consumes", []) if p in ship]
              if consumed:
                  more = f" and {len(consumed) - 3} more" if len(consumed) > 3 else ""
                  return True, f"consumes {len(consumed)} package(s) in this train: {', '.join(consumed[:3])}{more}"
              if ahead:
                  return True, f"{host['ref']} is ahead of main; consumes nothing in this train"
              return False, "unchanged" + (f" since {host['tag']['tag']}" if host.get("tag") else "") + \
                  "; consumes nothing in this train"


          def pins_at(dest, commit, ids):
              """The exact pins on ids at a commit, across its .csproj and Directory.Packages.props files: {id: highest}."""
              found = {}
              for path in git(["ls-tree", "-r", "--name-only", "-z", commit], cwd=dest, capture=True).split("\0"):
                  if (not path or {"bin", "obj"} & set(path.split("/")) or
                          not (path.endswith(".csproj") or path.rpartition("/")[2] == "Directory.Packages.props")):
                      continue
                  for m in PIN.finditer(git(["show", f"{commit}:{path}"], cwd=dest, capture=True)):
                      package_id, version = m.group("id"), m.group("version")
                      if package_id in ids and VERSION.fullmatch(version) and (
                              package_id not in found or version_key(version) > version_key(found[package_id])):
                          found[package_id] = version
              return found


          def published_versions(org, ids, before):
              """{id: newest release version on the org feed below the train version before} for each of ids the feed has:
              what was published (by an earlier train, in merge order) ahead of this train. Stamps grow with time, so a
              promote-only for the same train reads the same map the plan did."""
              found = {}
              for package_id in sorted(ids):
                  versions = [v for v in feed_versions(org, package_id)
                              if VERSION.fullmatch(v) and version_key(v) < version_key(before)]
                  if versions:
                      found[package_id] = max(versions, key=version_key)
              return found


          def newest(*maps):
              """The maps merged, keeping the highest version of each id."""
              merged = {}
              for versions in maps:
                  for package_id, version in (versions or {}).items():
                      if package_id not in merged or version_key(version) > version_key(merged[package_id]):
                          merged[package_id] = version
              return merged


          # --- Subcommands -------------------------------------------------------------------------------------------------

          def repo_assignments(text, what, value):
              """'repo=value' entries (one per line or comma-separated) as {repo: value}; reject conflicting values for one
              repo, accept identical repeats."""
              assigned = {}
              for entry in re.split(r"[,\n]", text or ""):
                  entry = entry.strip()
                  if not entry:
                      continue
                  name, sep, val = (part.strip() for part in entry.partition("="))
                  if not sep or not name or not val:
                      raise TrainError(f"{what} '{entry}' is not of the form repo={value}")
                  if name in assigned and assigned[name] != val:
                      raise TrainError(f"conflicting {what}s for {name}: '{assigned[name]}' and '{val}'")
                  assigned[name] = val
              return assigned


          def ref_overrides():
              """TRAIN_REF_OVERRIDES as {repo: ref}; reject conflicting refs, accept identical repeats."""
              return repo_assignments(os.environ.get("TRAIN_REF_OVERRIDES", ""), "ref override", "ref")


          # The train's own commits (pin bumps, reconciling main into the ref) carry this author and a "[train <version>]"
          # subject. That pair is how a plan recognises main being ahead of the ref by nothing but train commits.
          TRAIN_NAME, TRAIN_EMAIL = "release-train", "release-train@users.noreply.github.com"


          def train_commit(cwd, args):
              run(["git", "-c", f"user.name={TRAIN_NAME}", "-c", f"user.email={TRAIN_EMAIL}", *args], cwd=cwd)
              return git(["rev-parse", "HEAD"], cwd=cwd, capture=True).strip()


          def only_train_commits(dest, base, tip):
              """True when every commit in base..tip is one the train made (its author and a '[train ' subject)."""
              lines = git(["log", "--format=%ae%x1f%s", f"{base}..{tip}"], cwd=dest, capture=True).splitlines()
              return bool(lines) and all(line.split("\x1f", 1)[0] == TRAIN_EMAIL and
                                         line.split("\x1f", 1)[-1].startswith("[train ") for line in lines)


          def commit_pins(src, pins, version):
              ids = sorted({pid for _, pid, _, new in pins if new == version})
              others = sorted({f"{pid} to {new}" for _, pid, _, new in pins if new != version})
              message = f"[train {version}] pin " + "; ".join(
                  ([", ".join(ids) + f" to {version}"] if ids else []) + others)
              run(["git", "add", "--", *sorted({path for path, *_ in pins})], cwd=src)
              return train_commit(src, ["commit", "-q", "-m", message])


          def cmd_plan():
              manifest = load_manifest(os.environ["TRAIN_MANIFEST"])
              ref = os.environ.get("TRAIN_REF", "release")
              dry_run = os.environ.get("TRAIN_DRY_RUN", "true").lower() != "false"
              overrides = ref_overrides()
              if overrides and not dry_run:
                  raise TrainError("ref overrides are for dry runs only: a live train assembles every repository from "
                                   f"'{ref}' and promotes that to main (overrides named {', '.join(sorted(overrides))})")
              unknown = sorted(set(overrides) - {r["repo"] for r in manifest["repos"] + manifest["hosts"]})
              if unknown:
                  raise TrainError(f"ref overrides name repositories that are not in the manifest: {', '.join(unknown)}")
              if WORK.exists():
                  shutil.rmtree(WORK)
              SRC.mkdir(parents=True)
              FEED.mkdir(parents=True)

              repos = {}
              for repo in manifest["repos"]:
                  name = repo["repo"]
                  repo_ref = overrides.get(name, ref)
                  dest = checkout_dir(SRC, name)
                  sha = clone(manifest["org"], name, repo_ref, dest)
                  tag = latest_train_tag(dest)
                  main = git(["rev-parse", "origin/main"], cwd=dest, capture=True).strip()
                  log(f"{name}: {repo_ref} {sha[:12]}{' (override)' if name in overrides else ''}, main {main[:12]}, "
                      f"latest train tag {tag['tag'] if tag else '(none)'}")
                  projects = [describe_project(dest, p) for p in find_projects(dest)]
                  repos[name] = {**repo, "ref": repo_ref, "sha": sha, "base": sha, "main": main, "tag": tag, "projects": projects}
              # Hosts are read the same way, but produce nothing for the train: their projects never become package owners
              # or edges, so they sort after every package repository and are built last, against what the train packed.
              hosts = {}
              for host in manifest["hosts"]:
                  name = host["repo"]
                  repo_ref = overrides.get(name, ref)
                  dest = checkout_dir(SRC, name)
                  sha = clone(manifest["org"], name, repo_ref, dest)
                  tag = latest_train_tag(dest)
                  main = git(["rev-parse", "origin/main"], cwd=dest, capture=True).strip()
                  log(f"{name} (host): {repo_ref} {sha[:12]}{' (override)' if name in overrides else ''}, main {main[:12]}, "
                      f"latest train tag {tag['tag'] if tag else '(none)'}")
                  projects = [describe_project(dest, p) for p in find_projects(dest)]
                  hosts[name] = {**host, "ref": repo_ref, "sha": sha, "base": sha, "main": main, "tag": tag,
                                 "projects": projects, "project_order": [], "ships": []}

              owner = {}
              for name, repo in repos.items():
                  for project in repo["projects"]:
                      if project["packable"]:
                          if project["id"] in owner and owner[project["id"]] != name:
                              raise TrainError(f"package {project['id']} is produced by both {owner[project['id']]} and {name}")
                          owner[project["id"]] = name

              repo_edges = {name: sorted({owner[p] for project in repo["projects"] for p in project["packages"]
                                          if p in owner and owner[p] != name})
                            for name, repo in repos.items()}
              repo_order = toposort(list(repos), repo_edges, "repository")

              for name, repo in repos.items():
                  by_path = {p["path"]: p for p in repo["projects"]}
                  own = {p["id"]: p["path"] for p in repo["projects"] if p["packable"]}
                  edges = {p["path"]: sorted({own[i] for i in p["packages"] if i in own} | set(p["projects"]) & set(by_path))
                           for p in repo["projects"]}
                  repo["project_order"] = [path for path in toposort(list(by_path), edges, f"{name} project")
                                           if by_path[path]["packable"]]

              ship, decisions = select_packages(manifest["org"], repos, repo_order, set(owner))
              for name in repo_order:
                  repo = repos[name]
                  ids = {p["path"]: p["id"] for p in repo["projects"]}
                  repo["ships"] = [path for path in repo["project_order"] if ids[path] in ship]
                  # The ref has commits main lacks: main moves (and the repository is tagged) even when no package changed,
                  # since a workflow-only or docs-only change still belongs on main.
                  ahead = not is_ancestor(checkout_dir(SRC, name), repo["sha"], repo["main"])
                  repo["selected"] = bool(repo["ships"]) or ahead
                  if repo["ships"]:
                      repo["reason"] = f"{len(repo['ships'])} of {len(repo['project_order'])} package(s) changed"
                  elif ahead:
                      repo["reason"] = f"{repo['ref']} is ahead of main; no package changed, nothing to publish"
                  else:
                      repo["reason"] = "unchanged" + (f" since {repo['tag']['tag']}" if repo["tag"] else "")

              selected = [n for n in repo_order if repos[n]["selected"]]
              for name, host in hosts.items():
                  ahead = not is_ancestor(checkout_dir(SRC, name), host["sha"], host["main"])
                  host["consumes"] = sorted({p for project in host["projects"] for p in project["packages"]} & set(owner))
                  host["selected"], host["reason"] = select_host(host, ship, ahead)
              hosts_selected = [n for n in hosts if hosts[n]["selected"]]
              repos.update(hosts)
              warnings = []
              for name in selected + hosts_selected:
                  repo = repos[name]
                  dest = checkout_dir(SRC, name)
                  if not is_ancestor(dest, repo["main"], repo["sha"]):
                      if only_train_commits(dest, repo["sha"], repo["main"]):
                          # A previous train pushed main to its pin commit but could not push that commit to the ref, because a
                          # lane merged into the ref while the train ran. main is ahead by train commits only: the build step
                          # records main as merged into the ref (keeping the ref's tree; this train re-pins), so main
                          # fast-forwards again and nothing a lane merged is lost. The pins those commits set on packages
                          # outside this train are carried over from main, so main never moves a pin back.
                          repo["reconcile"] = repo["main"]
                          repo["carry"] = pins_at(dest, repo["main"], set(owner))
                          log(f"{name}: main ({repo['main'][:12]}) is ahead of {repo['ref']} by train commits only; "
                              f"this train reconciles it")
                      else:
                          message = (f"{name}: main ({repo['main'][:12]}) is not an ancestor of {repo['ref']} ({repo['sha'][:12]}), "
                                     f"so the train could publish it but never fast-forward main. Merge main into {repo['ref']} first.")
                          if not dry_run:
                              raise TrainError(message)
                          # A dry run promotes nothing, so it can still build and test the branch; the summary carries the warning.
                          warnings.append(message + " A live train refuses this repository.")
                          log(f"WARNING {message}")
                  repo["solution_file"] = find_solution(checkout_dir(SRC, name), repo) if repo["test"] else ""
                  if repo.get("host"):
                      # What the host's own CI builds; a host with no tests still has to compile against the train.
                      repo["build_file"] = repo["build"] or ("" if repo["test"] else find_solution(dest, repo))
                  repo["source_graph"] = SWITCH in ((checkout_dir(SRC, name) / "Directory.Build.targets").read_text()
                                                    if (checkout_dir(SRC, name) / "Directory.Build.targets").exists() else "")
                  repo["items"] = sorted(set(ITEM_KEY.findall(git(
                      ["log", "--format=%B", f"{repo['tag']['sha']}..{repo['sha']}" if repo["tag"] else repo["sha"],
                       *([] if repo["tag"] else ["-n", "200"])], cwd=checkout_dir(SRC, name), capture=True))))

              build, revision = stamp()
              version = normalized_version(build, revision)
              # Only the packages that changed are in the train. An exact pin on any other manifest package moves forward to
              # its newest version on the feed (published ahead of this train, in merge order), never back: a sibling's
              # float resolves to its newest version, which may already name a newer one than a stale csproj pin.
              train_ids = sorted(ship)
              published = published_versions(manifest["org"], set(owner) - set(ship), version)
              plan = {"org": manifest["org"], "ref": ref, "version": version, "build": build, "revision": revision,
                      "dry_run": dry_run, "overrides": overrides, "warnings": warnings,
                      "repo_order": repo_order, "selected": selected, "train_ids": train_ids, "ship": ship,
                      "decisions": decisions, "published": published,
                      "repo_edges": repo_edges, "repos": repos, "hosts": list(hosts), "hosts_selected": hosts_selected,
                      "packages": [], "promoted": [], "stranded": [], "release_behind": [], "release_refused": []}
              PLAN.write_text(json.dumps(plan, indent=2))

              log(f"\nTrain {version} ({'dry run' if dry_run else 'live'}), ref {ref}" +
                  (" with overrides " + ", ".join(f"{n}={r}" for n, r in sorted(overrides.items())) if overrides else ""))
              log(f"Repository order: {' -> '.join(repo_order)}" + (f", then hosts {', '.join(hosts)}" if hosts else ""))
              for name in repo_order:
                  deps = ", ".join(repo_edges[name]) or "nothing in the manifest"
                  log(f"  {'*' if repos[name]['selected'] else ' '} {name}: {repos[name]['reason']}; depends on {deps}")
              for name in hosts:
                  log(f"  {'*' if repos[name]['selected'] else ' '} {name} (host): {repos[name]['reason']}")
              log(f"Packages: {len(ship)} of {len(decisions)} in this train, across {len(repo_order)} repositories")
              for package_id, reason in ship.items():
                  log(f"  + {package_id}: {reason}")
              output("version", version)
              output("selected", ",".join(selected + hosts_selected))
              if not selected + hosts_selected:
                  log("Nothing changed since the last train; nothing to build.")


          def cmd_build():
              plan = json.loads(PLAN.read_text())
              train_ids = set(plan["train_ids"])
              version, env = plan["version"], dotnet_env()
              PACK.mkdir(exist_ok=True)
              packages = []
              # Hosts come last: they consume packages and produce none, so every package they could restore from this train
              # is in the local feed by then. Their exact pins resolve exactly as a package's do (the train version for an
              # in-train package, else newest(published, carry)), they are built and tested, never packed, and a failure here
              # fails the train before anything is published.
              for name in plan["selected"] + plan.get("hosts_selected", []):
                  repo = plan["repos"][name]
                  src, pack = checkout_dir(SRC, name), checkout_dir(PACK, name)
                  log(f"::group::{name}")
                  # Exact pins on in-train packages move to the train version first, in the source tree, before any copy: the
                  # train is the one place that knows the version it is about to publish. On a live train that edit is
                  # committed on top of the ref (only the project files, never the nuget.config edit below), so main and the
                  # ref receive exactly what was packed. A dry run keeps the edit in the runner's copy only.
                  if repo.get("reconcile") and not plan["dry_run"]:
                      # main is ahead of the ref by an earlier train's commits only (see plan). Record main as merged, keeping
                      # the ref's tree exactly: the pins below re-derive what those commits set, so main fast-forwards to
                      # this train's sha and the build still tests exactly the ref plus this train's pins.
                      repo["sha"] = train_commit(src, ["merge", "-q", "-s", "ours", "--no-ff", "-m",
                                                       f"[train {version}] reconcile main's train commits into {plan['ref']}",
                                                       repo["reconcile"]])
                      repo["train_commits"] = True
                  pins = pin_train_versions(src, train_ids, version, newest(plan.get("published"), repo.get("carry")))
                  repo["pins"] = [list(p) for p in pins]
                  if pins:
                      log(f"{name}: pinned {len(pins)} reference(s): " +
                          ", ".join(sorted({f'{pid} ({old} -> {new})' for _, pid, old, new in pins})))
                      if not plan["dry_run"]:
                          repo["sha"] = commit_pins(src, pins, version)
                          repo["train_commits"] = True
                  if repo.get("host"):
                      point_at_local_feed(src, train_ids)
                      build_host(repo, src, env)
                      log("::endgroup::")
                      log(f"{name} (host): built and tested at {version}, nothing packed")
                      continue
                  # Pack from a copy taken before anything is built: never pack a tree the source-graph switch touched.
                  if pack.exists():
                      shutil.rmtree(pack)
                  shutil.copytree(src, pack, symlinks=True)
                  for tree in (src, pack):
                      point_at_local_feed(tree, train_ids)
                  # Pack before testing: a pin bumped to the train version can only restore once the upstream package is in
                  # the local feed, and the project order puts it there first. Publishing is still gated on the tests below.
                  for path in repo["ships"]:
                      run(["dotnet", "pack", path, "-c", "Release", "-o", FEED, "-p:Branch=main",
                           f"-p:VersionBuild={plan['build']}", f"-p:VersionRevision={plan['revision']}",
                           "-p:ContinuousIntegrationBuild=true"], cwd=pack, env=env)
                  for path in repo["ships"]:
                      project = next(p for p in repo["projects"] if p["path"] == path)
                      packages.append({"repo": name, **check_package(project["id"], version, train_ids)})
                  if repo["test"]:
                      args = ["dotnet", "test", repo["solution_file"], "-c", "Release"]
                      if repo["source_graph"]:
                          args.append(f"-p:{SWITCH}=true")
                      args += repo["test-args"].split() if repo["test-args"] else []
                      # test-env: the manifest's acknowledgements for the runner, e.g. a suite's "no emulator here" variable.
                      run(args, cwd=src, env={**env, **repo.get("test-env", {})})
                  else:
                      log(f"{name}: tests skipped (\"test\": false in the manifest)")
                  log("::endgroup::")
                  log(f"{name}: {len(repo['ships'])} package(s) at {version}" +
                      (f"; {len(repo['project_order']) - len(repo['ships'])} unchanged, not packed"
                       if len(repo["ships"]) < len(repo["project_order"]) else ""))
              plan["packages"] = packages
              PLAN.write_text(json.dumps(plan, indent=2))


          def build_host(repo, src, env):
              """A host's gate, as its own CI runs it: build its build target (the deployable hosts), then test its test
              target, both against packages only. No source-graph switch: what a host has to prove is that it compiles and
              passes against the versions this train packed and pinned."""
              test_env = {**env, **repo.get("test-env", {})}
              if repo.get("build_file"):
                  run(["dotnet", "build", repo["build_file"], "-c", "Release"], cwd=src, env=test_env)
              if repo["test"]:
                  args = ["dotnet", "test", repo["solution_file"], "-c", "Release"]
                  args += repo["test-args"].split() if repo["test-args"] else []
                  run(args, cwd=src, env=test_env)
              else:
                  log(f"{repo['repo']}: tests skipped (\"test\": false in the manifest)")


          def cmd_publish():
              plan = json.loads(PLAN.read_text())
              source = f"https://nuget.pkg.github.com/{plan['org']}/index.json"
              for package in plan["packages"]:
                  run(["dotnet", "nuget", "push", FEED / package["file"], "--source", source,
                       "--api-key", os.environ["PACKAGES_TOKEN"], "--skip-duplicate", "--no-symbols"], env=dotnet_env())


          def promote_repo(plan, name, repo, dest):
              """Move one repository to what the train built: its train commits onto the ref when that still fast-forwards,
              main to the train's sha, and the train/<version> tag on it. Raises TrainError when main or the tag cannot move."""
              tag = f"train/{plan['version']}"
              if repo.get("train_commits"):
                  # The train's commits (pins, a reconcile merge) sit on top of the ref in the runner's clone. The ref takes
                  # them when that is a fast-forward. When a lane merged into the ref while the train ran, the push is refused
                  # and the ref keeps the lane's work: main still moves to exactly what was built and tested, and the next
                  # plan sees main ahead of the ref by train commits only and reconciles them (rule (a), coordinator:C44).
                  try:
                      git(["push", "origin", f"{repo['sha']}:refs/heads/{plan['ref']}"], cwd=dest)
                  except TrainError:
                      # Only a ref that moved is the expected case. When the remote ref is still an ancestor of what the
                      # train pushed, the push was a fast-forward and was refused for another reason (branch protection, the
                      # token's rights): say so, rather than letting every train quietly leave the ref behind.
                      try:
                          remote = git(["ls-remote", "origin", f"refs/heads/{plan['ref']}"], cwd=dest, capture=True).split()
                      except TrainError:
                          remote = []
                      if remote and is_ancestor(dest, remote[0], repo["sha"]):
                          plan.setdefault("release_refused", []).append(name)
                          log(f"::warning::{name}: the push of the train's commits to {plan['ref']} was refused although "
                              f"{plan['ref']} did not move (branch protection or the token's rights?); main still takes "
                              f"{repo['sha'][:12]}")
                      else:
                          plan["release_behind"].append(name)
                          log(f"::warning::{name}: {plan['ref']} moved while the train ran, so it does not carry the train's "
                              f"commits yet; main still takes {repo['sha'][:12]} and the next train reconciles {plan['ref']}")
              if repo["main"] != repo["sha"]:
                  # A plain push: the remote refuses anything but a fast-forward. Never forced.
                  git(["push", "origin", f"{repo['sha']}:refs/heads/main"], cwd=dest)
              run(["git", "-c", f"user.name={TRAIN_NAME}", "-c", f"user.email={TRAIN_EMAIL}",
                   "tag", "-a", tag, repo["sha"], "-m", f"Release train {plan['version']}"], cwd=dest)
              git(["push", "origin", f"refs/tags/{tag}"], cwd=dest)
              plan["promoted"].append(name)


          def promote_all(plan, names):
              """Promote every repository it can. Publication already happened, so a refusal in one repository is no reason to
              leave the rest unpromoted: it is recorded as stranded (with the sha it was built from, for promote-only) and the
              train carries on. Fails at the end, naming every stranded repository."""
              plan.setdefault("stranded", [])
              plan.setdefault("release_behind", [])
              for name in names:
                  repo, dest = plan["repos"][name], checkout_dir(SRC, name)
                  try:
                      promote_repo(plan, name, repo, dest)
                  except TrainError as error:
                      plan["stranded"].append({"repo": name, "sha": repo["sha"], "base": repo.get("base", repo["sha"]),
                                               "reason": redact(str(error))})
                      log(f"::error::{name}: not promoted: {redact(str(error))}")
                  PLAN.write_text(json.dumps(plan, indent=2))
              if plan["stranded"]:
                  entries = ", ".join(f"{s['repo']}={s['base']}" for s in plan["stranded"])
                  raise TrainError(f"{len(plan['stranded'])} repository(ies) published at {plan['version']} but not promoted: "
                                   f"{', '.join(s['repo'] for s in plan['stranded'])}. Once the cause is fixed, finish them with "
                                   f"the promote-only mode: version {plan['version']}, promote-only '{entries}'.")


          def cmd_promote():
              plan = json.loads(PLAN.read_text())
              # Hosts last, like the build: main moving is a host's deploy, so it moves only once every package repository
              # it consumes has been promoted (or recorded as stranded).
              promote_all(plan, [n for n in plan["selected"] + plan.get("hosts_selected", []) if n not in plan["promoted"]])


          def cmd_promote_only():
              """Finish a stranded promotion with the train's identity instead of by hand: for an already-published train
              version, fast-forward main and tag train/<version> at the given shas. Builds and publishes nothing. Each sha must
              be on the ref (or already on main, which only the train moves) and main must be its ancestor; every entry is
              checked before anything is pushed, including that the version is a published train (some manifest package is on
              the feed at it). The pins that train committed are re-derived on top of the sha: its packages are the ones on
              the feed at the version (each repository read at its tag, at the given sha, or at the train tag before it), and
              an exact pin on any other package moves forward only to its newest release on the feed below the version, or
              to what main already carries, as the build did, so main carries what was packed."""
              manifest = load_manifest(os.environ["TRAIN_MANIFEST"])
              ref = os.environ.get("TRAIN_REF", "release")
              dry_run = os.environ.get("TRAIN_DRY_RUN", "true").lower() != "false"
              version = os.environ.get("TRAIN_VERSION", "").strip()
              if not VERSION.fullmatch(version):
                  raise TrainError(f"promote-only needs the train version of an already-published train, got '{version}'")
              if os.environ.get("TRAIN_REF_OVERRIDES", "").strip():
                  raise TrainError("promote-only takes no ref overrides: it promotes the shas it is given")
              targets = repo_assignments(os.environ.get("TRAIN_PROMOTE", ""), "promote-only entry", "sha")
              if not targets:
                  raise TrainError("promote-only needs at least one repo=sha entry")
              unknown = sorted(set(targets) - {r["repo"] for r in manifest["repos"] + manifest["hosts"]})
              if unknown:
                  raise TrainError(f"promote-only names repositories that are not in the manifest: {', '.join(unknown)}")
              host_names = {h["repo"] for h in manifest["hosts"]}
              # A dispatch input reaches git as an argument: only a commit id (hex) is accepted, never a ref name or an option.
              not_sha = sorted(f"{n}={v}" for n, v in targets.items() if not re.fullmatch(r"[0-9a-fA-F]{7,40}", v))
              if not_sha:
                  raise TrainError(f"promote-only takes commit ids (7 to 40 hex digits), not: {', '.join(not_sha)}")
              if WORK.exists():
                  shutil.rmtree(WORK)
              SRC.mkdir(parents=True)
              tag = f"train/{version}"

              repos, tagged_at, others, problems = {}, {}, {}, []
              # A host is cloned only when it is named: it produces no package, so it never says what the train shipped.
              for entry in manifest["repos"] + [h for h in manifest["hosts"] if h["repo"] in targets]:
                  name = entry["repo"]
                  dest = checkout_dir(SRC, name)
                  tip = clone(manifest["org"], name, ref, dest)
                  tagged = bool(git(["tag", "--list", tag], cwd=dest, capture=True).strip())
                  if tagged:
                      tagged_at[name] = git(["rev-list", "-n", "1", tag], cwd=dest, capture=True).strip()
                  elif name not in targets and name not in host_names:
                      # Read at the train tag a plan for this train saw, or at the tip for a repository with none.
                      others[name] = (latest_train_tag(dest, before=version) or {"sha": tip})["sha"]
                  if name not in targets:
                      continue
                  main = git(["rev-parse", "origin/main"], cwd=dest, capture=True).strip()
                  given = targets[name]
                  try:
                      sha = git(["rev-parse", "--verify", "--quiet", f"{given}^{{commit}}"], cwd=dest, capture=True).strip()
                  except TrainError:
                      problems.append(f"{name}: {given} is not a commit in {name}")
                      continue
                  if tagged:
                      problems.append(f"{name}: {tag} already exists; that repository was promoted")
                  elif not (is_ancestor(dest, sha, tip) or is_ancestor(dest, sha, main)):
                      problems.append(f"{name}: {sha[:12]} is not on {ref} ({tip[:12]}) or main; promote-only only promotes "
                                      f"what a train built from {ref}")
                  elif not (is_ancestor(dest, main, sha) or only_train_commits(dest, sha, main)):
                      problems.append(f"{name}: main ({main[:12]}) is not an ancestor of {sha[:12]} and is ahead of it by "
                                      f"commits the train did not make, so main cannot fast-forward to it")
                  repos[name] = {"repo": name, "ref": ref, "sha": sha, "base": sha, "tip": tip, "main": main,
                                 "reason": f"promote-only at {sha[:12]}", "items": [], "selected": True,
                                 **({"host": True} if name in host_names else {})}
                  if not is_ancestor(dest, main, sha) and only_train_commits(dest, sha, main):
                      repos[name]["carry_from"] = main
              if problems:
                  raise TrainError("promote-only refused, nothing was pushed:\n  " + "\n  ".join(problems))

              def packable_ids_at(name, sha):
                  # Read each repository at the commit the train saw, never at the ref's current tip: a packable project
                  # added since would otherwise be pinned to a version that train never published.
                  dest = checkout_dir(SRC, name)
                  git(["checkout", "-q", "--detach", sha], cwd=dest)
                  return sorted(p["id"] for p in (describe_project(dest, c) for c in find_projects(dest)) if p["packable"])

              # The train's packages are exactly the ones on the feed at its version: a train publishes only what changed, so
              # a repository it tagged or stranded may have shipped some of its packages and not others.
              at = {**tagged_at, **others, **{name: repos[name]["sha"] for name in targets}}
              member_ids, manifest_ids, warnings = {}, set(), []
              for name in [r["repo"] for r in manifest["repos"]]:
                  ids = packable_ids_at(name, at[name])
                  manifest_ids.update(ids)
                  member_ids[name] = [i for i in ids if version in feed_versions(manifest["org"], i)]
                  if name in others and member_ids[name]:
                      warnings.append(f"{name} was in train {version} but is neither tagged nor named; its packages are pinned "
                                      f"at {version} here. Finish it with promote-only too.")
                      log(f"::warning::{warnings[-1]}")
              train_ids = {i for ids in member_ids.values() for i in ids}
              if not train_ids:
                  raise TrainError(f"promote-only refused, nothing was pushed: no package of any manifest repository is on the "
                                   f"feed at {version}; promote-only only finishes a train whose packages were published")
              # The same forward moves the build made: each other package's newest release published before this train.
              published = published_versions(manifest["org"], manifest_ids - train_ids, version)
              for name in targets:
                  if name in host_names:
                      log(f"{name} (host): main moves to what train {version} built and is tagged")
                  elif not member_ids[name]:
                      log(f"{name}: none of its packages is in train {version}; main still moves and is tagged")

              # Hosts last, as the train promotes them.
              names = [r["repo"] for r in manifest["repos"] + manifest["hosts"] if r["repo"] in targets]
              for name in names:
                  repo, dest = repos[name], checkout_dir(SRC, name)
                  git(["checkout", "-q", "--detach", repo["sha"]], cwd=dest)
                  if not is_ancestor(dest, repo["main"], repo["sha"]):
                      # main is ahead by train commits only (checked above): record it as merged, keeping the given tree.
                      repo["sha"] = train_commit(dest, ["merge", "-q", "-s", "ours", "--no-ff", "-m",
                                                        f"[train {version}] reconcile main's train commits", repo["main"]])
                      repo["train_commits"] = True
                  carry = pins_at(dest, repo["carry_from"], manifest_ids) if repo.get("carry_from") else {}
                  pins = pin_train_versions(dest, train_ids, version, newest(published, carry))
                  repo["pins"] = [list(p) for p in pins]
                  if pins:
                      repo["sha"] = commit_pins(dest, pins, version)
                      repo["train_commits"] = True
                  log(f"{name}: main {repo['main'][:12]} -> {repo['sha'][:12]} (from {repo['base'][:12]}"
                      f"{', with ' + str(len(pins)) + ' pin(s)' if pins else ''}), tag {tag}")
              plan = {"mode": "promote-only", "org": manifest["org"], "ref": ref, "version": version, "dry_run": dry_run,
                      "overrides": {}, "warnings": warnings, "repo_order": names, "selected": names,
                      "repo_edges": {n: [] for n in names}, "train_ids": sorted(train_ids),
                      "repos": repos, "packages": [], "promoted": [], "stranded": [], "release_behind": [], "release_refused": []}
              PLAN.write_text(json.dumps(plan, indent=2))
              output("version", version)
              if dry_run:
                  log("Dry run: nothing pushed.")
                  return
              promote_all(plan, names)


          def cmd_record():
              if not PLAN.exists():
                  log("No plan was written; nothing to record.")
                  return
              plan = json.loads(PLAN.read_text())
              mode = ("dry run" if plan["dry_run"] else "live") + (", promote-only" if plan.get("mode") == "promote-only" else "")
              ref_line = f"Ref `{plan['ref']}`. Order: {' → '.join(plan['repo_order'])}."
              if plan.get("overrides"):
                  ref_line += " Overrides (dry run only): " + ", ".join(f"`{n}={r}`" for n, r in sorted(plan["overrides"].items())) + "."
              lines = [f"## Release train {plan['version']} ({mode})", "", ref_line, "",
                       *[f"- ⚠️ {warning}" for warning in plan.get("warnings", [])], *([""] if plan.get("warnings") else []),
                       "| repo | in train | why | depends on | items |", "|---|---|---|---|---|"]
              for name in plan["repo_order"]:
                  repo = plan["repos"][name]
                  lines.append(f"| {name} | {'yes' if repo['selected'] else 'no'} | {repo['reason']} | "
                               f"{', '.join(plan['repo_edges'][name]) or '—'} | {', '.join(repo.get('items', [])) or '—'} |")
              for name in plan.get("hosts", []):
                  # Hosts: built and tested against the train, never packed; promoted to main (their deploy) on a live train.
                  repo = plan["repos"][name]
                  lines.append(f"| {name} (host) | {'yes' if repo['selected'] else 'no'} | {repo['reason']} | "
                               f"{', '.join(repo.get('consumes', [])) or '—'} | {', '.join(repo.get('items', [])) or '—'} |")
              if plan.get("decisions") is not None:
                  ship = plan.get("ship", {})
                  lines += ["", f"Repositories: {len(plan['repo_order'])} considered, {len(plan['selected'])} in this train. "
                                f"Packages: {len(plan['decisions'])} considered, {len(ship)} in this train; every other package "
                                f"is unchanged since its last publication and is neither packed nor pushed." +
                                (f" Hosts: {len(plan['hosts'])} considered, {len(plan.get('hosts_selected', []))} built and "
                                 f"tested against this train (never packed)." if plan.get("hosts") else "")]
              packed = {p["id"]: p for p in plan["packages"]}
              if plan.get("ship"):
                  lines += ["", "| package | why | version | in-train dependencies |", "|---|---|---|---|"]
                  lines += [f"| {i} | {reason} | {packed[i]['version'] if i in packed else plan['version'] + ' (not packed)'} | "
                            f"{', '.join(packed[i]['dependencies']) if i in packed and packed[i]['dependencies'] else '—'} |"
                            for i, reason in plan["ship"].items()]
              elif plan["packages"]:
                  lines += ["", "| package | version | in-train dependencies |", "|---|---|---|"]
                  lines += [f"| {p['id']} | {p['version']} | {', '.join(p['dependencies']) or '—'} |" for p in plan["packages"]]
              if plan["promoted"]:
                  lines += ["", f"Promoted (main fast-forwarded, tagged `train/{plan['version']}`): {', '.join(plan['promoted'])}."]
              if plan.get("release_behind"):
                  lines += ["", f"⚠️ `{plan['ref']}` moved while the train ran, so it does not carry the train's pin commit yet "
                                f"(main does; the next train reconciles it): {', '.join(plan['release_behind'])}."]
              if plan.get("release_refused"):
                  lines += ["", f"⚠️ The push of the train's commits to `{plan['ref']}` was **refused although `{plan['ref']}` did "
                                f"not move** (branch protection or the token's rights?); main took them: "
                                f"{', '.join(plan['release_refused'])}."]
              if plan.get("stranded"):
                  lines += ["", f"❌ **Stranded** (published at {plan['version']}, main not moved, not tagged): "
                                f"{', '.join(s['repo'] for s in plan['stranded'])}.", ""]
                  lines += [f"- {s['repo']} (built from `{s['base'][:12]}`): {s['reason']}" for s in plan["stranded"]]
                  lines += ["", "Finish them with the promote-only mode: version `" + plan["version"] + "`, promote-only `" +
                            ", ".join(f"{s['repo']}={s['base']}" for s in plan["stranded"]) + "`."]
              text = "\n".join(lines) + "\n"
              log(text)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                      f.write(text)
              url = os.environ.get("MERRYN_URL", "")
              # A train that published and promoted is a release, and so is one whose only failure was stranding some
              # repositories (its packages are on the feed): the record names them. A dry run, a train that failed before
              # promoting, and a promote-only recovery (it finishes a release already recorded) are in the summary only.
              published = os.environ.get("TRAIN_JOB_STATUS", "success") == "success" or plan.get("stranded")
              if (url and not plan["dry_run"] and plan.get("mode") != "promote-only" and published and plan["promoted"]):
                  record = {"release": plan["version"], "org": plan["org"], "ref": plan["ref"],
                            "repos": [{"repo": n, "sha": plan["repos"][n]["sha"], "items": plan["repos"][n].get("items", [])}
                                      for n in plan["selected"]],
                            "hosts": [{"repo": n, "sha": plan["repos"][n]["sha"], "items": plan["repos"][n].get("items", [])}
                                      for n in plan.get("hosts_selected", [])],
                            "packages": [{"id": p["id"], "version": p["version"]} for p in plan["packages"]],
                            "promoted": plan["promoted"], "stranded": [s["repo"] for s in plan.get("stranded", [])],
                            # The sha each stranded repository was built from: exactly the promote-only input that finishes
                            # it, so recovery copies it from the record rather than guessing a sha on the ref.
                            "strandedFrom": {s["repo"]: s["base"] for s in plan.get("stranded", [])},
                            "run": os.environ.get("TRAIN_RUN_URL", "")}
                  request = urllib.request.Request(url, data=json.dumps(record).encode(), method="POST", headers={
                      "Content-Type": "application/json", "Authorization": f"Bearer {os.environ.get('MERRYN_TOKEN', '')}"})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          log(f"Recorded in Merryn: HTTP {response.status}")
                  except Exception as error:  # the record is a report; a failure to file it must not fail a published train
                      log(f"::warning::Could not record the train in Merryn: {error}")


          def output(key, value):
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"{key}={value}\n")


          COMMANDS = {"plan": cmd_plan, "build": cmd_build, "publish": cmd_publish, "promote": cmd_promote,
                      "promote-only": cmd_promote_only, "record": cmd_record}

          if __name__ == "__main__":
              if len(sys.argv) != 2 or sys.argv[1] not in COMMANDS:
                  sys.exit(f"usage: train.py {{{'|'.join(COMMANDS)}}}")
              try:
                  COMMANDS[sys.argv[1]]()
              except TrainError as error:
                  print(f"::error::{redact(str(error))}", flush=True)
                  sys.exit(1)
          TRAIN_PY

      - name: Plan (clone, sort, select, stamp)
        id: plan
        if: ${{ inputs.promote-only == '' }}
        env:
          TRAIN_MANIFEST: caller/${{ inputs.manifest }}
          REPOS_TOKEN: ${{ secrets.repos-token }}
          PACKAGES_TOKEN: ${{ secrets.packages-token }}
        run: python3 "$RUNNER_TEMP/train.py" plan

      # Keyed on the cloned repositories' project files (no packages.lock.json: a lock file would pin every
      # Version="*" float to its last resolution).
      - name: Cache NuGet packages
        if: ${{ inputs.promote-only == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-train-${{ hashFiles('_train/src/**/*.csproj', '_train/src/**/Directory.Build.*', '_train/src/**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-train-

      - name: Build, test and pack into the local feed
        if: ${{ steps.plan.outputs.selected != '' }}
        env:
          PACKAGES_TOKEN: ${{ secrets.packages-token }}
        run: python3 "$RUNNER_TEMP/train.py" build

      - name: Upload the local feed (dry run)
        if: ${{ inputs.dry-run && steps.plan.outputs.selected != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-train-${{ steps.plan.outputs.version }}
          path: _train/feed/*.nupkg
          retention-days: 7

      - name: Publish
        if: ${{ !inputs.dry-run && steps.plan.outputs.selected != '' }}
        env:
          PACKAGES_TOKEN: ${{ secrets.packages-token }}
        run: python3 "$RUNNER_TEMP/train.py" publish

      - name: Promote (fast-forward main, tag train/<version>)
        if: ${{ !inputs.dry-run && steps.plan.outputs.selected != '' }}
        env:
          REPOS_TOKEN: ${{ secrets.repos-token }}
        run: python3 "$RUNNER_TEMP/train.py" promote

      - name: Promote only (recovery for a stranded promotion)
        id: promote-only
        if: ${{ inputs.promote-only != '' }}
        env:
          TRAIN_MANIFEST: caller/${{ inputs.manifest }}
          TRAIN_VERSION: ${{ inputs.version }}
          TRAIN_PROMOTE: ${{ inputs.promote-only }}
          REPOS_TOKEN: ${{ secrets.repos-token }}
          PACKAGES_TOKEN: ${{ secrets.packages-token }}
        run: python3 "$RUNNER_TEMP/train.py" promote-only

      - name: Record
        if: ${{ always() }}
        env:
          TRAIN_JOB_STATUS: ${{ job.status }}
          TRAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERRYN_URL: ${{ secrets.merryn-url }}
          MERRYN_TOKEN: ${{ secrets.merryn-token }}
        run: python3 "$RUNNER_TEMP/train.py" record
