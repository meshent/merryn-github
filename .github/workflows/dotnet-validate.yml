# Reusable: the one opt-in validation of a .NET repository, for a pull request that carries the ci:validate label.
# One job: restore with a warm cache, run the test gate from source (-p:UseProjectReferences=true when the
# repository's Directory.Build.targets has the switch), then pack every packable project into a throwaway folder
# to prove the nuspecs. Publishes nothing. Replaces the per-package fan-out that used to run on every PR.
# See docs/release-trains.md section 4; the caller gates it on the label and the budget (README).
name: Validate .NET repository (reusable)

on:
  workflow_call:
    inputs:
      solution:
        description: Solution to test; empty picks the first *.slnx or *.sln at the repository root
        type: string
        default: ""
      pack:
        description: Also pack every packable project into a throwaway folder (proves the nuspecs)
        type: boolean
        default: true
      dotnet-version:
        type: string
        default: "10.0.x"
    secrets:
      packages-token:
        description: read:packages on the feed the repository restores from; falls back to GITHUB_TOKEN
        required: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.packages-token || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Not setup-dotnet's cache: that needs packages.lock.json, and a lock file pins every Version="*" reference.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test from source
        env:
          SOLUTION: ${{ inputs.solution }}
        run: |
          set -euo pipefail
          sol="$SOLUTION"
          [ -n "$sol" ] || sol=$(ls -1 *.slnx *.sln 2>/dev/null | head -1 || true)
          [ -n "$sol" ] || { echo "::error::no solution at the repository root; pass solution:"; exit 2; }
          if [ -f Directory.Build.targets ] && grep -q UseProjectReferences Directory.Build.targets; then
            dotnet test "$sol" --configuration Release -p:UseProjectReferences=true --nologo
          else
            dotnet test "$sol" --configuration Release --nologo
          fi

      - name: Pack every packable project (throwaway)
        if: ${{ inputs.pack }}
        run: |
          set -euo pipefail
          # Never pack from a tree built with the switch: clean first so obj/ is restored without it.
          git clean -xdfq
          out="$RUNNER_TEMP/pack"
          while IFS= read -r proj; do
            case "$proj" in */Tests/*|*/bin/*|*/obj/*) continue;; esac
            grep -q 'Microsoft.NET.Test.Sdk\|<IsTestProject>true\|<IsPackable>false' "$proj" && continue
            echo "::group::pack $proj"
            dotnet pack "$proj" --configuration Release --nologo --output "$out"
            echo "::endgroup::"
          done < <(find . -name '*.csproj' -not -path '*/.git/*' | sort)
          ls -1 "$out" 2>/dev/null || echo "nothing packable"
