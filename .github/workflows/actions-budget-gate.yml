# Reusable: read the organization's GitHub Actions usage for the current billing month and publish a throttle
# state that every workflow in the organization can read for free.
#
# GitHub bills each job rounded up to a whole minute and stops starting jobs the moment the included minutes
# plus the spending limit are spent: a lockout that also stops the hotfix that would fix it. This workflow makes
# the organization slow down first. It reads used and included minutes, sets one organization-level Actions
# variable (default ACTIONS_BUDGET_STATE) to ok, soft or hard, and every other workflow's jobs carry
#
#   if: ${{ vars.ACTIONS_BUDGET_STATE != 'hard' }}          (PR validation also adds  != 'soft')
#
# which GitHub evaluates without starting a runner. A skipped job is not billed; an unset variable reads as the
# empty string, so a repository that has never seen the gate keeps running. Call this from one small scheduled
# wrapper per organization (see README.md); the wrapper itself must NOT carry the guard, or a hard state can
# never be lifted.
#
# Usage sources, in order: the legacy endpoint GET /orgs/{org}/settings/billing/actions (total and included
# minutes; organizations moved to the enhanced billing platform may report stale totals there) and the
# enhanced endpoint GET /organizations/{org}/settings/billing/usage for the month (Actions line items in
# minutes; no allowance, so `included-minutes` supplies it when the legacy value is missing). The larger of
# the two totals wins. If neither answers, the variable is left exactly as it was and the run warns.
name: Actions budget gate (reusable)

on:
  workflow_call:
    inputs:
      org:
        description: The organization whose usage is read and whose variable is set, e.g. meshent
        type: string
        required: true
      soft-percent:
        description: Percent of included minutes at which the state becomes soft (optional work stops)
        type: number
        default: 70
      hard-percent:
        description: Percent of included minutes at which the state becomes hard (only overrides run)
        type: number
        default: 90
      included-minutes:
        description: The plan's included minutes per month; 0 reads it from the legacy endpoint (Free 2000, Team 3000)
        type: number
        default: 0
      variable:
        description: Name of the organization variable that carries the state
        type: string
        default: ACTIONS_BUDGET_STATE
    secrets:
      billing-token:
        description: A token of an organization owner or billing manager that can read billing and write organization Actions variables (classic scopes admin:org; the default GITHUB_TOKEN cannot do either)
        required: true
    outputs:
      state:
        description: ok | soft | hard, or unknown when no usage source answered
        value: ${{ jobs.gate.outputs.state }}
      used-percent:
        description: Whole percent of included minutes used this month
        value: ${{ jobs.gate.outputs.used-percent }}

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      state: ${{ steps.read.outputs.state }}
      used-percent: ${{ steps.read.outputs.percent }}
    steps:
      - name: Read usage and set the state
        id: read
        env:
          GH_TOKEN: ${{ secrets.billing-token }}
          ORG: ${{ inputs.org }}
          SOFT: ${{ inputs.soft-percent }}
          HARD: ${{ inputs.hard-percent }}
          INCLUDED_INPUT: ${{ inputs.included-minutes }}
          VAR: ${{ inputs.variable }}
        run: |
          set -u
          used=""; included="${INCLUDED_INPUT:-0}"; source=""

          # 1. Legacy endpoint: total and included minutes.
          if legacy=$(gh api "orgs/$ORG/settings/billing/actions" 2>/dev/null); then
            u=$(jq -r '.total_minutes_used // empty' <<<"$legacy")
            i=$(jq -r '.included_minutes // empty' <<<"$legacy")
            [ -n "$u" ] && { used="$u"; source="legacy"; }
            if [ "$included" = "0" ] && [ -n "$i" ] && [ "$i" != "0" ]; then included="$i"; fi
          fi

          # 2. Enhanced billing usage endpoint: Actions minutes this month. The larger total wins.
          year=$(date -u +%Y); month=$(date -u +%-m)
          if usage=$(gh api "organizations/$ORG/settings/billing/usage?year=$year&month=$month" 2>/dev/null); then
            u=$(jq -r '[.usageItems[]? | select(((.product // "") | ascii_downcase) == "actions" and ((.unitType // "") | ascii_downcase) == "minutes") | (.quantity // 0)] | add // empty' <<<"$usage")
            if [ -n "$u" ]; then
              u=${u%.*}
              if [ -z "$used" ] || [ "$u" -gt "${used%.*}" ]; then used="$u"; source="usage"; fi
            fi
          fi

          if [ -z "$used" ]; then
            echo "::warning::No usage source answered for $ORG (both billing endpoints failed or returned nothing). The variable $VAR is left as it was."
            echo "state=unknown" >> "$GITHUB_OUTPUT"; echo "percent=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          used=${used%.*}
          if [ "$included" = "0" ] || [ -z "$included" ]; then
            echo "::warning::Included minutes unknown for $ORG: the legacy endpoint gave none and included-minutes is 0. Pass included-minutes (Free 2000, Team 3000). The variable $VAR is left as it was."
            echo "state=unknown" >> "$GITHUB_OUTPUT"; echo "percent=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          percent=$(( used * 100 / included ))
          if [ "$percent" -ge "${HARD%.*}" ]; then state=hard
          elif [ "$percent" -ge "${SOFT%.*}" ]; then state=soft
          else state=ok; fi

          day=$(date -u +%-d); days_in_month=$(date -u -d "$(date -u +%Y-%m-01) +1 month -1 day" +%-d)
          days_left=$(( days_in_month - day ))
          burn=$(( used / day ))
          projected=$(( burn * days_in_month ))

          previous=$(gh variable get "$VAR" --org "$ORG" 2>/dev/null || echo "")

          # Write the state and the percent. A failure here is loud: a gate that cannot write is not a gate.
          gh variable set "$VAR" --org "$ORG" --visibility all --body "$state"
          gh variable set "${VAR}_USED_PERCENT" --org "$ORG" --visibility all --body "$percent"

          {
            echo "## Actions budget: $ORG"
            echo
            echo "| used | included | percent | state | day | days left | burn/day | projected month |"
            echo "|---|---|---|---|---|---|---|---|"
            echo "| $used | $included | $percent% | **$state** | $day/$days_in_month | $days_left | $burn | $projected |"
            echo
            echo "Source: $source. Thresholds: soft ${SOFT%.*}%, hard ${HARD%.*}%. Previous state: ${previous:-<unset>}."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$previous" != "$state" ]; then
            echo "::warning::Actions budget state for $ORG changed: ${previous:-<unset>} -> $state ($used of $included minutes, $percent%, $days_left days left in the month, projected $projected at the current burn)."
          fi
          if [ "$state" = "hard" ]; then
            echo "::error::Actions budget for $ORG is HARD: $percent% of $included included minutes used with $days_left days left. Every guarded job now skips; only a dispatched run with an override runs. Raise the allowance or wait for the reset."
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"; echo "percent=$percent" >> "$GITHUB_OUTPUT"
